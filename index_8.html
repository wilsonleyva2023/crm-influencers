<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>TM FIX — Estudio de tiempos</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#F4F2EC;
    --panel:#FFFFFF;
    --ink:#1E2A24;
    --ink-soft:#5B655F;
    --line:#DEDACD;
    --brand:#1F4B3F;
    --brand-ink:#FFFFFF;
    --accent:#C6742E;
    --accent-bg:#FBECDD;
    --danger:#B14A3A;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--ink);
    -webkit-tap-highlight-color:transparent;
  }
  header{ padding:20px 20px 8px; max-width:480px; margin:0 auto; }
  .brand{ font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft); margin:0 0 2px; }
  h1{ font-size:20px; font-weight:600; margin:0 0 16px; }
  main{ max-width:480px; margin:0 auto; padding:0 20px 100px; }
  input[type="text"]{
    width:100%; padding:12px 14px; border:1px solid var(--line); border-radius:var(--radius);
    font-size:15px; background:var(--panel); color:var(--ink); margin-bottom:18px;
  }
  input[type="text"]:focus{outline:2px solid var(--brand); outline-offset:1px;}
  .section-label{ font-size:12px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.06em; margin:0 0 10px; }
  .grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:22px; }
  .rubro-btn{
    position:relative; display:flex; flex-direction:column; align-items:center; gap:8px;
    padding:18px 10px 14px; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    font-size:14px; color:var(--ink); cursor:pointer; text-align:center;
  }
  .rubro-btn:active{background:var(--accent-bg);}
  .menu-dot{
    position:absolute; top:6px; right:6px; width:26px; height:26px;
    display:flex; align-items:center; justify-content:center; border-radius:50%;
    color:var(--ink-soft); font-size:16px; background:transparent; border:none; cursor:pointer;
  }
  .menu-dot:active{background:var(--bg);}
  .list{ display:flex; flex-direction:column; gap:8px; margin-bottom:22px; }
  .list-item{
    position:relative; display:flex; align-items:center; justify-content:space-between;
    padding:14px 16px; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    font-size:14px; cursor:pointer;
  }
  .list-item .row-main{ display:flex; flex-direction:column; }
  .list-item .sub{ color:var(--ink-soft); font-size:12px; }
  .list-item .menu-dot{ position:static; margin-left:8px; }
  .ghost-btn{
    width:100%; padding:13px; border:1px dashed var(--line); border-radius:var(--radius);
    background:transparent; color:var(--ink-soft); font-size:14px; cursor:pointer; margin-bottom:10px;
  }
  .back{ display:flex; align-items:center; gap:6px; color:var(--ink-soft); font-size:13px; margin-bottom:6px; cursor:pointer; }
  .empty{ text-align:center; padding:40px 10px; color:var(--ink-soft); font-size:14px; }
  .modal-bg{
    position:fixed; inset:0; background:rgba(30,42,36,.45); display:none;
    align-items:flex-end; justify-content:center; z-index:10;
  }
  .modal-bg.open{display:flex;}
  .modal{ background:var(--panel); width:100%; max-width:480px; border-radius:20px 20px 0 0; padding:22px 20px 28px; }
  .modal h2{font-size:16px; margin:0 0 14px;}
  .modal p.hint{font-size:13px; color:var(--ink-soft); margin:-6px 0 14px;}
  .modal input, .modal select{
    width:100%; padding:12px 14px; border:1px solid var(--line); border-radius:10px;
    font-size:15px; margin-bottom:12px;
  }
  .modal-actions{display:flex; gap:10px; margin-top:8px;}
  .menu-item{
    width:100%; text-align:left; padding:14px 4px; background:none; border:none;
    border-bottom:1px solid var(--line); font-size:15px; color:var(--ink); cursor:pointer;
  }
  .menu-item:last-child{border-bottom:none;}
  .menu-item.danger{color:var(--danger);}
  .btn{ flex:1; padding:13px; border-radius:10px; border:none; font-size:14px; cursor:pointer; }
  .btn.primary{background:var(--brand); color:var(--brand-ink);}
  .btn.danger{background:var(--danger); color:#fff;}
  .btn.secondary{background:var(--bg); color:var(--ink); border:1px solid var(--line);}
  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:#fff; padding:10px 18px; border-radius:20px; font-size:13px;
    opacity:0; transition:opacity .2s; pointer-events:none; z-index:20; max-width:85%; text-align:center;
  }
  .toast.show{opacity:1;}
  .tab-btn{
    padding:9px 6px; font-size:12.5px; border-radius:10px; border:1px solid var(--line);
    background:var(--panel); color:var(--ink-soft); cursor:pointer;
  }
  .tab-btn.activo{ background:var(--brand); color:#fff; border-color:var(--brand); }
</style>
</head>
<body>

<header>
  <p class="brand">TM FIX</p>
  <h1 id="titulo">¿Qué rubro vas a trabajar?</h1>
  <div style="display:flex; gap:6px; margin:14px 0 6px;">
    <button class="tab-btn activo" id="tabCronometro" onclick="irAModo('cronometro')" style="flex:1;">Cronómetro</button>
    <button class="tab-btn" id="tabPresupuestos" onclick="irAModo('presupuestos')" style="flex:1;">Presupuestos</button>
    <button class="tab-btn" id="tabPanel" onclick="irAModo('panel')" style="flex:1;">Panel</button>
  </div>
</header>

<main id="app"></main>

<!-- Crear/editar rubro -->
<div class="modal-bg" id="modalRubroBg">
  <div class="modal">
    <h2 id="modalRubroTitulo">Rubro nuevo</h2>
    <input type="text" id="nombreRubroInput" placeholder="Ej: Electricidad">
    <div class="modal-actions">
      <button class="btn secondary" onclick="cerrarModalRubro()">Cancelar</button>
      <button class="btn primary" onclick="guardarRubro()">Guardar</button>
    </div>
  </div>
</div>

<!-- Crear/editar tarea -->
<div class="modal-bg" id="modalTareaBg">
  <div class="modal">
    <h2 id="modalTareaTitulo">Tarea nueva</h2>
    <input type="text" id="nombreTareaInput" placeholder="Ej: Picado de pared">
    <input type="text" id="unidadTareaInput" placeholder="Unidad de medida (ej: metro, unidad)">
    <div class="modal-actions">
      <button class="btn secondary" onclick="cerrarModalTarea()">Cancelar</button>
      <button class="btn primary" onclick="guardarTarea()">Guardar</button>
    </div>
  </div>
</div>

<!-- Menú de opciones (renombrar / borrar) -->
<div class="modal-bg" id="modalMenuBg">
  <div class="modal">
    <h2 id="modalMenuTitulo">Opciones</h2>
    <div id="modalMenuOpciones"></div>
    <div class="modal-actions" style="margin-top:14px;">
      <button class="btn secondary" onclick="cerrarModalMenu()">Cancelar</button>
    </div>
  </div>
</div>

<!-- Agregar opción a una categoría -->
<div class="modal-bg" id="modalOpcionBg">
  <div class="modal">
    <h2>Opción nueva</h2>
    <input type="text" id="nombreOpcionInput" placeholder="Ej: Con revoque">
    <div class="modal-actions">
      <button class="btn secondary" onclick="cerrarModalOpcion()">Cancelar</button>
      <button class="btn primary" onclick="guardarOpcion()">Guardar</button>
    </div>
  </div>
</div>

<!-- Vincular / crear categoría de variable -->
<div class="modal-bg" id="modalVincularBg">
  <div class="modal">
    <h2>Agregar categoría de variable</h2>
    <p class="hint">Elegí una que ya exista, o creá una nueva</p>
    <div id="categoriasDisponiblesLista" style="margin-bottom:14px;"></div>
    <input type="text" id="nombreCategoriaNuevaInput" placeholder="O escribí el nombre de una categoría nueva">
    <div class="modal-actions">
      <button class="btn secondary" onclick="cerrarModalVincular()">Cancelar</button>
      <button class="btn primary" onclick="crearYVincularCategoria()">Crear y agregar</button>
    </div>
  </div>
</div>

<!-- Confirmación de borrado -->
<div class="modal-bg" id="modalConfirmBg">
  <div class="modal">
    <h2>¿Borrar?</h2>
    <p class="hint" id="modalConfirmTexto"></p>
    <div class="modal-actions">
      <button class="btn secondary" onclick="cerrarModalConfirm()">Cancelar</button>
      <button class="btn danger" onclick="confirmarBorrado()">Sí, borrar</button>
    </div>
  </div>
</div>

<!-- Cargar error/desperdicio -->
<div class="modal-bg" id="modalErrorBg">
  <div class="modal">
    <h2>¿Qué pasó?</h2>
    <div id="tiposErrorLista" style="display:flex; flex-direction:column; gap:6px; margin-bottom:14px;"></div>
    <p class="hint" style="margin-bottom:8px;">Gravedad</p>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:16px;">
      <button class="btn secondary" id="btnGravedadMenor" onclick="elegirGravedad('menor')">Menor</button>
      <button class="btn secondary" id="btnGravedadGrave" onclick="elegirGravedad('grave')">Grave</button>
    </div>
    <div style="display:flex; gap:8px; margin-bottom:8px;">
      <label class="btn secondary" style="text-align:center; display:flex; align-items:center; justify-content:center;">
        📷 Foto
        <input type="file" accept="image/*" capture="environment" style="display:none;" onchange="subirArchivoError(this, 'foto')">
      </label>
      <label class="btn secondary" style="text-align:center; display:flex; align-items:center; justify-content:center;">
        🎤 Audio
        <input type="file" accept="audio/*" capture style="display:none;" onchange="subirArchivoError(this, 'audio')">
      </label>
    </div>
    <p class="hint" id="estadoArchivoError" style="margin-bottom:14px;"></p>
    <div class="modal-actions">
      <button class="btn secondary" onclick="cerrarModalError()">Cancelar</button>
      <button class="btn primary" onclick="guardarError()">Guardar y seguir trabajando</button>
    </div>
  </div>
</div>

<!-- Agregar tarea a un presupuesto -->
<div class="modal-bg" id="modalItemPresupuestoBg">
  <div class="modal">
    <h2>Agregar tarea</h2>
    <select id="selectRubroPresupuesto" onchange="cambiarRubroPresupuesto()"></select>
    <select id="selectTareaPresupuesto"></select>
    <input type="text" id="cantidadPresupuestoInput" placeholder="Cantidad (ej: 6)">
    <div class="modal-actions">
      <button class="btn secondary" onclick="cerrarModalItemPresupuesto()">Cancelar</button>
      <button class="btn primary" onclick="agregarItemPresupuesto()">Agregar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  // --- Conexión a Supabase ---
  const SUPABASE_URL = "https://ixccafpufhiogoumvolo.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml4Y2NhZnB1Zmhpb2dvdW12b2xvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUwMzUxMzMsImV4cCI6MjEwMDYxMTEzM30.1CPvISEoE4-lHOhx8DoUIjT5KrEwTpldm2KTqiuNQu0";
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let rubros = [];
  let tareas = [];
  let vista = "inicio"; // inicio | tareas | detalle
  let rubroActual = null;

  let tareaActual = null;
  let categoriasVinculadas = [];  // [{...tarea_categorias, categorias_variables:{...}, opciones:[...]}]
  let categoriasTodas = [];       // todas las categorías del sistema (para vincular existentes)
  let seleccionVariables = {};    // { categoria_id: opcion_id }

  // estado del cronómetro
  let registroEnCursoId = null;
  let cronometroEstado = "detenido"; // detenido | trabajando | pausa_normal | pausa_imprevisto
  let inicioTramoActual = null;      // timestamp del inicio del tramo actual (trabajo o pausa)
  let acumTrabajoMs = 0;
  let acumPausaNormalMs = 0;
  let acumPausaImprevistoMs = 0;
  let intervaloCronometro = null;

  // estado de edición / menú / confirmación
  let editandoRubro = null;   // rubro que se está renombrando/creando (null = nuevo)
  let editandoTarea = null;
  let menuTipo = null;        // "rubro" | "tarea"
  let menuItem = null;        // el objeto rubro/tarea sobre el que se abrió el menú
  let confirmAccion = null;   // función a ejecutar si confirma el borrado

  const app = document.getElementById("app");
  const titulo = document.getElementById("titulo");

  function toast(msg){
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(()=>t.classList.remove("show"), 2600);
  }

  // ---------- Carga de datos ----------
  async function cargarRubros(){
    const { data, error } = await sb.from("rubros").select("*").order("orden").order("nombre");
    if(error){ toast("No se pudieron cargar los rubros"); console.error(error); return; }
    rubros = data || [];
    render();
  }

  async function cargarTareas(rubroId){
    const { data, error } = await sb.from("tareas").select("*").eq("rubro_id", rubroId).order("orden").order("nombre");
    if(error){ toast("No se pudieron cargar las tareas"); console.error(error); return; }
    tareas = data || [];
    render();
  }

  function irATareas(rubro){
    rubroActual = rubro;
    vista = "tareas";
    titulo.textContent = "¿Qué tarea vas a hacer?";
    cargarTareas(rubro.id);
  }

  function volverAInicio(){
    vista = "inicio";
    rubroActual = null;
    titulo.textContent = "¿Qué rubro vas a trabajar?";
    cargarRubros();
  }

  function filtrar(lista, texto, campo){
    if(!texto) return lista;
    const t = texto.toLowerCase();
    return lista.filter(x => x[campo].toLowerCase().includes(t));
  }

  function render(){
    if(vista === "inicio") renderInicio();
    else if(vista === "tareas") renderTareas();
    else if(vista === "detalle") renderDetalle();
    else if(vista === "cronometro") renderCronometro();
    else if(vista === "cierre") renderCierre();
    else if(vista === "estadisticas") renderEstadisticas();
  }

  // ---------- Navegación a detalle de tarea ----------
  async function irADetalleTarea(tarea){
    tareaActual = tarea;
    vista = "detalle";
    titulo.textContent = tarea.nombre;
    await cargarDetalleTarea();
  }

  function volverATareas(){
    vista = "tareas";
    tareaActual = null;
    titulo.textContent = "¿Qué tarea vas a hacer?";
    render();
  }

  async function cargarDetalleTarea(){
    // categorías ya vinculadas a esta tarea, con sus opciones
    const { data: vinc, error: e1 } = await sb
      .from("tarea_categorias")
      .select("obligatoria, categoria_id, categorias_variables(id, nombre)")
      .eq("tarea_id", tareaActual.id);
    if(e1){ toast("No se pudieron cargar las variables"); console.error(e1); return; }

    categoriasVinculadas = [];
    for(const v of (vinc || [])){
      const { data: opciones } = await sb.from("opciones_variables").select("*").eq("categoria_id", v.categoria_id).order("nombre");
      categoriasVinculadas.push({
        categoria_id: v.categoria_id,
        nombre: v.categorias_variables.nombre,
        obligatoria: v.obligatoria,
        opciones: opciones || []
      });
    }

    const { data: todas } = await sb.from("categorias_variables").select("*").order("nombre");
    categoriasTodas = todas || [];

    render();
  }

  function renderDetalle(){
    let html = `<div class="back" onclick="volverATareas()">← ${rubroActual.nombre}</div>`;
    html += `<p class="section-label">Categorías de variables</p>`;

    if(categoriasVinculadas.length === 0){
      html += `<div class="empty">Esta tarea todavía no tiene categorías de variables.<br>Podés arrancar el cronómetro igual, o sumar alguna.</div>`;
    } else {
      html += `<div class="list" style="margin-bottom:14px;">`;
      categoriasVinculadas.forEach(c=>{
        const seleccionada = seleccionVariables[c.categoria_id];
        html += `<div style="background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:14px;">
          <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;">
            <span style="font-weight:600; font-size:14px;">${c.nombre}${c.obligatoria ? ' <span style="color:var(--danger); font-weight:400;">*</span>' : ''}</span>
            <button class="menu-dot" onclick='abrirMenuCategoria(${JSON.stringify(c)})'>⋯</button>
          </div>
          <label style="display:flex; align-items:center; gap:8px; font-size:13px; color:var(--ink-soft); margin-bottom:10px;">
            <input type="checkbox" ${c.obligatoria ? "checked" : ""} onchange='cambiarObligatoria("${c.categoria_id}", this.checked)'>
            Obligatoria para arrancar el cronómetro
          </label>
          <div style="display:flex; flex-wrap:wrap; gap:6px;">`;
        c.opciones.forEach(o=>{
          const activo = seleccionada === o.id;
          const estilo = activo
            ? "background:var(--brand); color:#fff;"
            : "background:var(--accent-bg); color:var(--accent);";
          html += `<span style="${estilo} font-size:12px; padding:6px 12px; border-radius:12px; cursor:pointer;" onclick='elegirVariable("${c.categoria_id}", "${o.id}")'>${o.nombre}</span>`;
        });
        html += `<button style="font-size:12px; padding:5px 10px; border-radius:12px; border:1px dashed var(--line); background:none; color:var(--ink-soft);" onclick='abrirModalOpcion("${c.categoria_id}")'>+ opción</button>`;
        html += `</div></div>`;
      });
      html += `</div>`;
    }

    html += `<button class="ghost-btn" onclick="abrirModalVincular()">+ Agregar categoría de variable</button>`;
    html += `<button class="ghost-btn" onclick="verEstadisticas()">📊 Ver estadísticas de esta tarea</button>`;

    const faltanObligatorias = categoriasVinculadas.some(c => c.obligatoria && !seleccionVariables[c.categoria_id]);
    html += faltanObligatorias
      ? `<button class="btn secondary" style="width:100%; margin-top:14px; padding:16px; opacity:.5;" disabled>Elegí las variables marcadas con * para arrancar</button>`
      : `<button class="btn primary" style="width:100%; margin-top:14px; padding:16px;" onclick='iniciarCronometro()'>Iniciar cronómetro</button>`;

    app.innerHTML = html;
  }

  function elegirVariable(categoriaId, opcionId){
    if(seleccionVariables[categoriaId] === opcionId){
      delete seleccionVariables[categoriaId]; // tocar de nuevo deselecciona
    } else {
      seleccionVariables[categoriaId] = opcionId;
    }
    render();
  }

  // ---------- Cronómetro ----------
  async function iniciarCronometro(){
    const { data, error } = await sb.from("registros").insert({ tarea_id: tareaActual.id, tiempo_trabajado_seg: 0 }).select().single();
    if(error){ toast("No se pudo iniciar el registro"); console.error(error); return; }
    registroEnCursoId = data.id;

    const filas = Object.entries(seleccionVariables).map(([categoria_id, opcion_id]) => ({ registro_id: registroEnCursoId, opcion_id }));
    if(filas.length > 0){
      const { error: e2 } = await sb.from("registro_variables").insert(filas);
      if(e2){ console.error(e2); }
    }

    acumTrabajoMs = 0; acumPausaNormalMs = 0; acumPausaImprevistoMs = 0;
    cronometroEstado = "trabajando";
    inicioTramoActual = Date.now();
    vista = "cronometro";
    titulo.textContent = tareaActual.nombre;
    intervaloCronometro = setInterval(renderCronometro, 1000);
    render();
  }

  function msTranscurridosTramo(){
    return inicioTramoActual ? (Date.now() - inicioTramoActual) : 0;
  }

  function formatoTiempo(ms){
    const seg = Math.floor(ms / 1000);
    const h = String(Math.floor(seg / 3600)).padStart(2, "0");
    const m = String(Math.floor((seg % 3600) / 60)).padStart(2, "0");
    const s = String(seg % 60).padStart(2, "0");
    return `${h}:${m}:${s}`;
  }

  function cambiarEstadoCronometro(nuevoEstado){
    // cierra el tramo actual y lo suma al acumulador que corresponda
    const transcurrido = msTranscurridosTramo();
    if(cronometroEstado === "trabajando") acumTrabajoMs += transcurrido;
    else if(cronometroEstado === "pausa_normal") acumPausaNormalMs += transcurrido;
    else if(cronometroEstado === "pausa_imprevisto") acumPausaImprevistoMs += transcurrido;

    cronometroEstado = nuevoEstado;
    inicioTramoActual = Date.now();
    render();
  }

  function renderCronometro(){
    const msActual = msTranscurridosTramo();
    let msMostrado, etiqueta, colorFondo;
    if(cronometroEstado === "trabajando"){
      msMostrado = acumTrabajoMs + msActual;
      etiqueta = "Trabajando"; colorFondo = "var(--brand)";
    } else if(cronometroEstado === "pausa_normal"){
      msMostrado = acumPausaNormalMs + msActual;
      etiqueta = "En pausa"; colorFondo = "var(--ink-soft)";
    } else {
      msMostrado = acumPausaImprevistoMs + msActual;
      etiqueta = "Imprevisto"; colorFondo = "var(--accent)";
    }

    let html = `<div style="background:${colorFondo}; color:#fff; border-radius:var(--radius); padding:28px 20px; text-align:center; margin-bottom:18px;">
      <p style="font-size:12px; text-transform:uppercase; letter-spacing:.06em; opacity:.85; margin:0 0 8px;">${etiqueta}</p>
      <p style="font-size:40px; font-weight:600; margin:0; font-variant-numeric:tabular-nums;">${formatoTiempo(msMostrado)}</p>
    </div>`;

    if(cronometroEstado === "trabajando"){
      html += `<div style="display:flex; gap:10px; margin-bottom:10px;">
        <button class="btn secondary" onclick="cambiarEstadoCronometro('pausa_normal')">Pausar</button>
        <button class="btn secondary" onclick="cambiarEstadoCronometro('pausa_imprevisto')">Interrumpido</button>
      </div>`;
    } else {

  function detenerCronometro(){
    clearInterval(intervaloCronometro);
    // cierra el último tramo abierto
    const transcurrido = msTranscurridosTramo();
    if(cronometroEstado === "trabajando") acumTrabajoMs += transcurrido;
    else if(cronometroEstado === "pausa_normal") acumPausaNormalMs += transcurrido;
    else if(cronometroEstado === "pausa_imprevisto") acumPausaImprevistoMs += transcurrido;

    vista = "cierre";
    render();
  }

  function renderCierre(){
    let html = `<p class="section-label">Registro terminado</p>`;
    html += `<p style="font-size:18px; font-weight:600; margin:0 0 16px;">${tareaActual.nombre}</p>`;

    const chips = Object.entries(seleccionVariables).map(([catId, opId])=>{

    }).filter(Boolean);
    if(chips.length){

      chips.forEach(nombre=>{
        html += `<span style="background:var(--accent-bg); color:var(--accent); font-size:12px; padding:5px 10px; border-radius:12px;">${nombre}</span>`;
      });
      html += `</div>`;
    }

    html += `<div style="border-top:1px solid var(--line); padding-top:14px; margin-bottom:16px;">
      <table style="width:100%; font-size:14px; border-collapse:collapse;">
        <tr><td style="color:var(--ink-soft); padding:5px 0;">Tiempo trabajado</td><td style="text-align:right; font-weight:600;">${formatoTiempo(acumTrabajoMs)}</td></tr>

        <tr><td style="color:var(--ink-soft); padding:5px 0;">Pausa por imprevisto</td><td style="text-align:right;">${formatoTiempo(acumPausaImprevistoMs)}</td></tr>
      </table>

    html += `<button class="btn primary" style="width:100%; padding:16px;" onclick="guardarRegistro()">Guardar registro</button>`;

  async function guardarRegistro(){
    const { error } = await sb.from("registros").update({

  // ---------- Error / desperdicio ----------
  const TIPOS_ERROR = [
    { tipo: "falta_material", nombre: "Falta de material", origen: "externo" },
    { tipo: "herramienta_rota", nombre: "Herramienta rota", origen: "propio" },
    { tipo: "cliente_ausente", nombre: "Cliente ausente", origen: "externo" },
    { tipo: "medida_mal_tomada", nombre: "Medida mal tomada", origen: "propio" },
    { tipo: "otro", nombre: "Otro", origen: "propio" }
  ];
  let errorTipoElegido = null;
  let errorGravedad = "menor";
  let errorFotoUrl = null;
  let errorAudioUrl = null;

  function abrirModalError(){
    errorTipoElegido = null;
    errorGravedad = "menor";
    errorFotoUrl = null;
    errorAudioUrl = null;
    document.getElementById("estadoArchivoError").textContent = "";
    renderTiposError();
    document.getElementById("btnGravedadMenor").style.cssText = "background:var(--brand); color:#fff;";
    document.getElementById("btnGravedadGrave").style.cssText = "";

  function cerrarModalError(){ document.getElementById("modalErrorBg").classList.remove("open"); }

  function renderTiposError(){

    cont.innerHTML = TIPOS_ERROR.map(t=>{
      const activo = errorTipoElegido === t.tipo;
      return `<button class="btn ${activo ? "primary" : "secondary"}" style="text-align:left;" onclick='elegirTipoError("${t.tipo}")'>${t.nombre}</button>`;
    }).join("");
  }
  function elegirTipoError(tipo){
    errorTipoElegido = tipo;

  }
  function elegirGravedad(g){

    document.getElementById("btnGravedadMenor").style.cssText = g === "menor" ? "background:var(--brand); color:#fff;" : "";
    document.getElementById("btnGravedadGrave").style.cssText = g === "grave" ? "background:var(--danger); color:#fff;" : "";

  async function subirArchivoError(input, tipo){
    const file = input.files[0];
    if(!file) return;
    document.getElementById("estadoArchivoError").textContent = "Subiendo " + tipo + "...";
    const nombreArchivo = `${Date.now()}_${file.name}`;
    const { error } = await sb.storage.from("errores").upload(nombreArchivo, file);
    if(error){
      toast("No se pudo subir el " + tipo);
      console.error(error);
      document.getElementById("estadoArchivoError").textContent = "";
      return;
    }
    const { data } = sb.storage.from("errores").getPublicUrl(nombreArchivo);
    if(tipo === "foto") errorFotoUrl = data.publicUrl;
    else errorAudioUrl = data.publicUrl;
    document.getElementById("estadoArchivoError").textContent = (tipo === "foto" ? "Foto" : "Audio") + " lista ✓";
  }

  async function guardarError(){
    if(!errorTipoElegido){ toast("Elegí qué pasó"); return; }
    const info = TIPOS_ERROR.find(t => t.tipo === errorTipoElegido);
    const { error } = await sb.from("errores").insert({
      registro_id: registroEnCursoId,
      tipo: info.nombre,
      gravedad: errorGravedad,
      origen: info.origen,
      foto_url: errorFotoUrl,
      audio_url: errorAudioUrl
    });

    cerrarModalError();

  // ---------- Matriz de variables (estadísticas por tarea) ----------
  const MINIMO_DATOS_CONFIABLES = 5;
  let estadRegistros = [];
  let estadPorOpcion = {}; // opcion_id -> { suma, cuenta }
  let estadHolguraPct = 12;

  async function verEstadisticas(){
    vista = "estadisticas";
    titulo.textContent = "Estadísticas";
    app.innerHTML = `<div class="empty">Calculando...</div>`;
    await cargarEstadisticas();
    render();
  }

  function volverADetalleDesdeEstadisticas(){
    vista = "detalle";
    titulo.textContent = tareaActual.nombre;
    render();
  }

  async function cargarEstadisticas(){
    const { data: registros, error } = await sb.from("registros").select("id, tiempo_trabajado_seg").eq("tarea_id", tareaActual.id);
    if(error){ toast("No se pudieron cargar los datos"); console.error(error); return; }
    estadRegistros = registros || [];

    const { data: rubroData } = await sb.from("rubros").select("holgura_pct").eq("id", rubroActual.id).single();
    estadHolguraPct = rubroData && rubroData.holgura_pct != null ? rubroData.holgura_pct : 12;

    const mapaTiempos = {};
    estadRegistros.forEach(r => mapaTiempos[r.id] = r.tiempo_trabajado_seg);
    const ids = estadRegistros.map(r => r.id);

    estadPorOpcion = {};
    if(ids.length > 0){
      const { data: rv } = await sb.from("registro_variables").select("registro_id, opcion_id").in("registro_id", ids);
      (rv || []).forEach(row=>{
        if(!estadPorOpcion[row.opcion_id]) estadPorOpcion[row.opcion_id] = { suma: 0, cuenta: 0 };
        estadPorOpcion[row.opcion_id].suma += mapaTiempos[row.registro_id];
        estadPorOpcion[row.opcion_id].cuenta += 1;
      });
    }
  }

  function segMin(seg){
    const min = seg / 60;
    return min < 10 ? min.toFixed(1) + " min" : Math.round(min) + " min";
  }

  function renderEstadisticas(){
    let html = `<div class="back" onclick="volverADetalleDesdeEstadisticas()">← ${tareaActual.nombre}</div>`;

    if(estadRegistros.length === 0){
      html += `<div class="empty">Todavía no cronometraste esta tarea ninguna vez.<br>En cuanto guardes el primer registro, acá vas a empezar a ver los tiempos.</div>`;
      app.innerHTML = html;
      return;
    }

    const sumaTotal = estadRegistros.reduce((a, r) => a + r.tiempo_trabajado_seg, 0);
    const promedioGeneral = sumaTotal / estadRegistros.length;
    const tiempoEstandar = promedioGeneral * (1 + estadHolguraPct / 100);

    html += `<div style="background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:14px; margin-bottom:18px;">
      <p style="font-size:12px; color:var(--ink-soft); margin:0 0 2px;">Tiempo base (promedio real)</p>
      <p style="font-size:18px; font-weight:600; margin:0 0 10px;">${segMin(promedioGeneral)}</p>
      <p style="font-size:12px; color:var(--ink-soft); margin:0 0 2px;">Tiempo estándar (con ${estadHolguraPct}% de holgura)</p>
      <p style="font-size:22px; font-weight:600; margin:0 0 2px; color:var(--brand);">${segMin(tiempoEstandar)}</p>
      <p style="font-size:12px; color:var(--ink-soft); margin:0;">${estadRegistros.length} registro(s) en total</p>
    </div>`;

    if(categoriasVinculadas.length === 0){
      html += `<div class="empty">Esta tarea no tiene categorías de variables, así que no hay desglose para mostrar — solo el promedio general de arriba.</div>`;
    } else {
      categoriasVinculadas.forEach(c=>{
        html += `<p class="section-label">${c.nombre}</p><div class="list" style="margin-bottom:16px;">`;
        c.opciones.forEach(o=>{
          const est = estadPorOpcion[o.id];
          if(!est || est.cuenta === 0){
            html += `<div class="list-item" style="cursor:default;"><span>${o.nombre}</span><span class="sub">sin datos</span></div>`;
          } else {
            const prom = est.suma / est.cuenta;
            const diffPct = Math.round(((prom - promedioGeneral) / promedioGeneral) * 100);
            const pocosDatos = est.cuenta < MINIMO_DATOS_CONFIABLES;
            const etiquetaDiff = diffPct === 0 ? "≈ promedio" : (diffPct > 0 ? `+${diffPct}%` : `${diffPct}%`);
            html += `<div class="list-item" style="cursor:default;">
              <span>${o.nombre}</span>
              <span class="sub" style="${pocosDatos ? "color:var(--accent);" : ""}">${segMin(prom)} · ${etiquetaDiff} · ${est.cuenta} reg.${pocosDatos ? " (pocos datos)" : ""}</span>
            </div>`;
          }
        });
        html += `</div>`;
      });
    }

    app.innerHTML = html;
  }

  // ---------- Pantalla: tareas de un rubro ----------

  // ---------- Modal: rubro (crear / renombrar) ----------
  function abrirModalRubro(rubro){

  function cerrarModalRubro(){ document.getElementById("modalRubroBg").classList.remove("open"); }

  async function guardarRubro(){
    const nombre = document.getElementById("nombreRubroInput").value.trim();
    if(!nombre){ toast("Ponele un nombre al rubro"); return; }

    if(editandoRubro){
      const { error } = await sb.from("rubros").update({ nombre }).eq("id", editandoRubro.id);
      if(error){ toast("No se pudo renombrar"); console.error(error); return; }
      toast("Rubro actualizado");
    } else {
      const { error } = await sb.from("rubros").insert({ nombre });
      if(error){ toast("No se pudo crear el rubro"); console.error(error); return; }
      toast("Rubro creado");

    cerrarModalRubro();
    cargarRubros();

  // ---------- Modal: tarea (crear / renombrar) ----------
  function abrirModalTarea(tarea){

    if(!nombre || !unidad){ toast("Completá nombre y unidad"); return; }

    if(editandoTarea){

  // ---------- Menú (⋯): renombrar / borrar / desvincular ----------
  function abrirMenu(tipo, item){
    menuTipo = tipo;
    menuItem = item;
    document.getElementById("modalMenuTitulo").textContent = item.nombre;

    let botones = `<button class="menu-item" onclick="menuRenombrar()">Renombrar</button>`;
    if(tipo === "categoria"){
      botones += `<button class="menu-item" onclick="menuDesvincular()">Quitar de esta tarea</button>`;
      botones += `<button class="menu-item danger" onclick="menuBorrar()">Borrar categoría de todo el sistema</button>`;
    } else if(tipo === "rubro"){
      botones += `<button class="menu-item" onclick="menuConfigurarHolgura()">Configurar holgura</button>`;
      botones += `<button class="menu-item danger" onclick="menuBorrar()">Borrar</button>`;

    document.getElementById("modalMenuOpciones").innerHTML = botones;
    document.getElementById("modalMenuBg").classList.add("open");

    abrirMenu("categoria", { id: c.categoria_id, nombre: c.nombre });

  function cerrarModalMenu(){ document.getElementById("modalMenuBg").classList.remove("open"); }

  function menuRenombrar(){
    cerrarModalMenu();
    if(menuTipo === "rubro") abrirModalRubro(menuItem);
    else if(menuTipo === "tarea") abrirModalTarea(menuItem);
    else abrirModalCategoria(menuItem);

  async function menuDesvincular(){
    cerrarModalMenu();
    abrirConfirm(`"${menuItem.nombre}" deja de pedirse en esta tarea. La categoría y sus opciones siguen existiendo para usarlas en otras tareas.`, async () => {
      const { error } = await sb.from("tarea_categorias").delete().eq("tarea_id", tareaActual.id).eq("categoria_id", menuItem.id);
      if(error){ toast("No se pudo quitar"); console.error(error); return; }
      toast("Categoría quitada de esta tarea");
      cargarDetalleTarea();
    });
  }

  async function menuBorrar(){
    cerrarModalMenu();
    if(menuTipo === "rubro"){
      const { count } = await sb.from("tareas").select("id", { count: "exact", head: true }).eq("rubro_id", menuItem.id);
      const texto = count > 0
        ? `"${menuItem.nombre}" tiene ${count} tarea(s) cargada(s). Si lo borrás, esas tareas y todo lo que hayas cronometrado en ellas se pierde. ¿Confirmás?`
        : `¿Seguro que querés borrar "${menuItem.nombre}"? Todavía no tiene tareas cargadas.`;
      abrirConfirm(texto, async () => {
        const { error } = await sb.from("rubros").delete().eq("id", menuItem.id);
        if(error){ toast("No se pudo borrar"); console.error(error); return; }
        toast("Rubro borrado");
        cargarRubros();
      });
    } else if(menuTipo === "tarea"){
      const { count } = await sb.from("registros").select("id", { count: "exact", head: true }).eq("tarea_id", menuItem.id);
      const texto = count > 0
        ? `"${menuItem.nombre}" tiene ${count} registro(s) de cronómetro cargados. Si la borrás, se pierden esos datos y ya no vas a poder usarlos para calcular tiempos. ¿Confirmás?`
        : `¿Seguro que querés borrar "${menuItem.nombre}"? Todavía no tiene registros cargados.`;
      abrirConfirm(texto, async () => {
        const { error } = await sb.from("tareas").delete().eq("id", menuItem.id);
        if(error){ toast("No se pudo borrar"); console.error(error); return; }
        toast("Tarea borrada");
        cargarTareas(rubroActual.id);
      });
    } else {
      // categoria: borrarla del sistema entero (todas las tareas que la usan la pierden)
      const { count } = await sb.from("tarea_categorias").select("tarea_id", { count: "exact", head: true }).eq("categoria_id", menuItem.id);
      const texto = `"${menuItem.nombre}" se usa en ${count} tarea(s) en total. Si la borrás del sistema, desaparece de todas ellas junto con sus opciones. ¿Confirmás?`;
      abrirConfirm(texto, async () => {
        await sb.from("opciones_variables").delete().eq("categoria_id", menuItem.id);
        await sb.from("tarea_categorias").delete().eq("categoria_id", menuItem.id);
        const { error } = await sb.from("categorias_variables").delete().eq("id", menuItem.id);
        if(error){ toast("No se pudo borrar"); console.error(error); return; }
        toast("Categoría borrada");
        cargarDetalleTarea();
      });
    }
  }

    const { error } = await sb.from("categorias_variables").update({ nombre: nuevo.trim() }).eq("id", cat.id);

    toast("Categoría renombrada");
    cargarDetalleTarea();
  }

  async function guardarOpcion(){
    const nombre = document.getElementById("nombreOpcionInput").value.trim();
    if(!nombre){ toast("Ponele un nombre a la opción"); return; }
    const { error } = await sb.from("opciones_variables").insert({ nombre, categoria_id: categoriaParaOpcion });
    if(error){ toast("No se pudo agregar la opción"); console.error(error); return; }
    cerrarModalOpcion();
    toast("Opción agregada");
    cargarDetalleTarea();
  }

  // ---------- Vincular categoría existente o crear una nueva ----------
  function abrirModalVincular(){
    const yaVinculadasIds = categoriasVinculadas.map(c => c.categoria_id);
    const disponibles = categoriasTodas.filter(c => !yaVinculadasIds.includes(c.id));
    const cont = document.getElementById("categoriasDisponiblesLista");
    if(disponibles.length === 0){
      cont.innerHTML = `<p class="hint">No tenés otras categorías creadas todavía.</p>`;
    } else {
      cont.innerHTML = disponibles.map(c =>
        `<button class="menu-item" onclick='vincularCategoria("${c.id}")'>${c.nombre}</button>`
      ).join("");
    }
    document.getElementById("nombreCategoriaNuevaInput").value = "";
    document.getElementById("modalVincularBg").classList.add("open");
  }
  function cerrarModalVincular(){ document.getElementById("modalVincularBg").classList.remove("open"); }

  async function vincularCategoria(categoriaId){
    const { error } = await sb.from("tarea_categorias").insert({ tarea_id: tareaActual.id, categoria_id: categoriaId, obligatoria: false });
    if(error){ toast("No se pudo agregar"); console.error(error); return; }
    cerrarModalVincular();
    toast("Categoría agregada");
    cargarDetalleTarea();
  }

  async function crearYVincularCategoria(){
    const nombre = document.getElementById("nombreCategoriaNuevaInput").value.trim();
    if(!nombre){ toast("Escribí un nombre para la categoría nueva"); return; }
    const { data, error } = await sb.from("categorias_variables").insert({ nombre }).select().single();
    if(error){ toast("No se pudo crear la categoría"); console.error(error); return; }
    await vincularCategoria(data.id);
  }

  // ---------- Confirmación genérica ----------
  function abrirConfirm(texto, accion){
    document.getElementById("modalConfirmTexto").textContent = texto;
    confirmAccion = accion;
    document.getElementById("modalConfirmBg").classList.add("open");
  }
  function cerrarModalConfirm(){ document.getElementById("modalConfirmBg").classList.remove("open"); confirmAccion = null; }
  function confirmarBorrado(){
    const accion = confirmAccion;
    cerrarModalConfirm();
    if(accion) accion();
  }

  // ---------- Pestañas principales ----------
  let appModo = "cronometro"; // cronometro | presupuestos | panel

  function irAModo(modo){
    appModo = modo;
    document.getElementById("tabCronometro").classList.toggle("activo", modo === "cronometro");
    document.getElementById("tabPresupuestos").classList.toggle("activo", modo === "presupuestos");
    document.getElementById("tabPanel").classList.toggle("activo", modo === "panel");

    if(modo === "cronometro"){
      vista = "inicio";
      titulo.textContent = "¿Qué rubro vas a trabajar?";
      cargarRubros();
    } else if(modo === "presupuestos"){
      titulo.textContent = "Presupuestos";
      presupuestoEnEdicion = null;
      cargarPresupuestos();
    } else {
      titulo.textContent = "Panel de control";
      cargarPanel();
    }
  }

  // ---------- Presupuestos ----------
  let presupuestosGuardados = [];
  let presupuestoEnEdicion = null; // { cliente, items: [{tarea_id, nombre, unidad, cantidad, tiempo_seg}] }
  let tarifaHora = 15000;

  async function cargarPresupuestos(){
    const { data: config } = await sb.from("configuracion").select("valor").eq("clave", "tarifa_hora").single();
    tarifaHora = config ? parseFloat(config.valor) : 15000;

    const { data, error } = await sb.from("presupuestos").select("*").order("creado_en", { ascending: false });
    if(error){ toast("No se pudieron cargar los presupuestos"); console.error(error); return; }
    presupuestosGuardados = data || [];
    renderPresupuestos();
  }

  function renderPresupuestos(){
    if(presupuestoEnEdicion){ renderBuilderPresupuesto(); return; }

    let html = "";
    if(presupuestosGuardados.length === 0){
      html += `<div class="empty">Todavía no armaste ningún presupuesto.</div>`;
    } else {
      html += `<div class="list" style="margin-bottom:16px;">`;
      presupuestosGuardados.forEach(p=>{
        html += `<div class="list-item" style="cursor:default;">
          <div class="row-main">
            <span>${p.cliente}</span>
            <span class="sub">${new Date(p.creado_en).toLocaleDateString("es-AR")} · ${p.estado}</span>
          </div>
          <span style="font-weight:600;">$${Math.round(p.total_precio).toLocaleString("es-AR")}</span>
        </div>`;
      });
      html += `</div>`;
    }
    html += `<button class="ghost-btn" onclick="abrirBuilderPresupuesto()">+ Nuevo presupuesto</button>`;
    html += `<button class="ghost-btn" onclick="cambiarTarifa()">⚙ Tarifa por hora: $${tarifaHora.toLocaleString("es-AR")}</button>`;
    app.innerHTML = html;
  }

  function abrirBuilderPresupuesto(){
    presupuestoEnEdicion = { cliente: "", items: [] };
    renderBuilderPresupuesto();
  }
  function cancelarBuilderPresupuesto(){
    presupuestoEnEdicion = null;
    renderPresupuestos();
  }

  function renderBuilderPresupuesto(){
    let html = `<div class="back" onclick="cancelarBuilderPresupuesto()">← Cancelar</div>`;
    html += `<input type="text" id="clientePresupuestoInput" placeholder="Nombre del cliente" value="${presupuestoEnEdicion.cliente}" oninput="presupuestoEnEdicion.cliente=this.value">`;

    if(presupuestoEnEdicion.items.length === 0){
      html += `<div class="empty">Todavía no agregaste ninguna tarea.</div>`;
    } else {
      html += `<div class="list" style="margin-bottom:14px;">`;
      presupuestoEnEdicion.items.forEach((it, i)=>{
        html += `<div class="list-item" style="cursor:default;">
          <div class="row-main"><span>${it.nombre}</span><span class="sub">${it.cantidad} ${it.unidad}</span></div>
          <div style="display:flex; align-items:center; gap:8px;">
            <span>${segMin(it.tiempo_seg)}</span>
            <button class="menu-dot" onclick="quitarItemPresupuesto(${i})">✕</button>
          </div>
        </div>`;
      });
      html += `</div>`;
    }

    html += `<button class="ghost-btn" onclick="abrirModalItemPresupuesto()">+ Agregar tarea</button>`;

    const totalSeg = presupuestoEnEdicion.items.reduce((a, it) => a + it.tiempo_seg, 0);
    const totalHoras = totalSeg / 3600;
    const totalPrecio = totalHoras * tarifaHora;

    html += `<div style="border-top:1px solid var(--line); padding-top:14px; margin:14px 0;">
      <table style="width:100%; font-size:14px;">
        <tr><td style="color:var(--ink-soft); padding:4px 0;">Mano de obra (${totalHoras.toFixed(1)} hs)</td><td style="text-align:right; font-weight:600;">$${Math.round(totalPrecio).toLocaleString("es-AR")}</td></tr>
        <tr><td style="color:var(--ink-soft); padding:4px 0;">Materiales</td><td style="text-align:right; color:var(--ink-soft);">sin cargar</td></tr>
      </table>
    </div>`;

    html += `<button class="btn primary" style="width:100%; padding:16px;" onclick="guardarPresupuesto()">Guardar presupuesto</button>`;
    app.innerHTML = html;
  }

  function quitarItemPresupuesto(i){
    presupuestoEnEdicion.items.splice(i, 1);
    renderBuilderPresupuesto();
  }

  async function abrirModalItemPresupuesto(){
    const { data: rubrosData } = await sb.from("rubros").select("*").order("nombre");
    const sel = document.getElementById("selectRubroPresupuesto");
    sel.innerHTML = rubrosData.map(r => `<option value="${r.id}">${r.nombre}</option>`).join("");
    sel.dataset.rubros = JSON.stringify(rubrosData);
    document.getElementById("cantidadPresupuestoInput").value = "";
    await cambiarRubroPresupuesto();
    document.getElementById("modalItemPresupuestoBg").classList.add("open");
  }
  function cerrarModalItemPresupuesto(){ document.getElementById("modalItemPresupuestoBg").classList.remove("open"); }

  async function cambiarRubroPresupuesto(){
    const rubroId = document.getElementById("selectRubroPresupuesto").value;
    const { data: tareasData } = await sb.from("tareas").select("*").eq("rubro_id", rubroId).order("nombre");
    const selT = document.getElementById("selectTareaPresupuesto");
    if(!tareasData || tareasData.length === 0){
      selT.innerHTML = `<option value="">Este rubro no tiene tareas</option>`;
    } else {
      selT.innerHTML = tareasData.map(t => `<option value="${t.id}" data-nombre="${t.nombre}" data-unidad="${t.unidad_medida}">${t.nombre} (${t.unidad_medida})</option>`).join("");
    }
  }

  async function agregarItemPresupuesto(){
    const tareaId = document.getElementById("selectTareaPresupuesto").value;
    const rubroId = document.getElementById("selectRubroPresupuesto").value;
    const cantidad = parseFloat(document.getElementById("cantidadPresupuestoInput").value);
    if(!tareaId){ toast("Este rubro no tiene tareas todavía"); return; }
    if(!cantidad || cantidad <= 0){ toast("Poné una cantidad válida"); return; }

    const opt = document.getElementById("selectTareaPresupuesto").selectedOptions[0];
    const nombre = opt.dataset.nombre;
    const unidad = opt.dataset.unidad;

    const { data: registrosTarea } = await sb.from("registros").select("tiempo_trabajado_seg").eq("tarea_id", tareaId);
    const { data: rubroData } = await sb.from("rubros").select("holgura_pct").eq("id", rubroId).single();
    const holgura = rubroData && rubroData.holgura_pct != null ? rubroData.holgura_pct : 12;

    let tiempoUnitario;
    if(registrosTarea && registrosTarea.length > 0){
      const promedio = registrosTarea.reduce((a, r) => a + r.tiempo_trabajado_seg, 0) / registrosTarea.length;
      tiempoUnitario = promedio * (1 + holgura / 100);
    } else {
      const minutosManual = prompt(`Todavía no hay registros de "${nombre}" para calcular el tiempo solo.\nPoné cuántos minutos calculás por ${unidad}:`, "30");
      if(minutosManual === null) return;
      tiempoUnitario = (parseFloat(minutosManual) || 0) * 60;
    }

    presupuestoEnEdicion.items.push({
      tarea_id: tareaId,
      nombre, unidad, cantidad,
      tiempo_seg: Math.round(tiempoUnitario * cantidad)
    });

    cerrarModalItemPresupuesto();
    renderBuilderPresupuesto();
  }

  async function guardarPresupuesto(){
    if(!presupuestoEnEdicion.cliente.trim()){ toast("Ponele un nombre al cliente"); return; }
    if(presupuestoEnEdicion.items.length === 0){ toast("Agregá al menos una tarea"); return; }

    const totalSeg = presupuestoEnEdicion.items.reduce((a, it) => a + it.tiempo_seg, 0);
    const totalPrecio = (totalSeg / 3600) * tarifaHora;

    const { data: pres, error } = await sb.from("presupuestos").insert({
      cliente: presupuestoEnEdicion.cliente.trim(),
      total_seg: totalSeg,
      total_precio: totalPrecio
    }).select().single();
    if(error){ toast("No se pudo guardar el presupuesto"); console.error(error); return; }

    const filas = presupuestoEnEdicion.items.map(it => ({
      presupuesto_id: pres.id, tarea_id: it.tarea_id, cantidad: it.cantidad, tiempo_seg: it.tiempo_seg
    }));
    await sb.from("presupuesto_items").insert(filas);

    toast("Presupuesto guardado");
    presupuestoEnEdicion = null;
    cargarPresupuestos();
  }

  async function cambiarTarifa(){
    const nueva = prompt("Tarifa por hora ($):", tarifaHora);
    if(nueva === null) return;
    const valor = parseFloat(nueva);
    if(isNaN(valor)){ toast("Poné un número válido"); return; }
    await sb.from("configuracion").update({ valor: String(valor) }).eq("clave", "tarifa_hora");
    tarifaHora = valor;
    toast("Tarifa actualizada");
    renderPresupuestos();
  }

  // ---------- Panel de control (versión simple) ----------
  async function cargarPanel(){
    app.innerHTML = `<div class="empty">Calculando...</div>`;

    const { data: registrosTodos } = await sb.from("registros").select("tiempo_trabajado_seg, tiempo_pausa_imprevisto_seg");
    const { data: erroresTodos } = await sb.from("errores").select("gravedad");
    const { count: totalRubros } = await sb.from("rubros").select("id", { count: "exact", head: true });
    const { count: totalTareas } = await sb.from("tareas").select("id", { count: "exact", head: true });

    const totalHoras = (registrosTodos || []).reduce((a, r) => a + r.tiempo_trabajado_seg, 0) / 3600;
    const totalImprevisto = (registrosTodos || []).reduce((a, r) => a + (r.tiempo_pausa_imprevisto_seg || 0), 0) / 3600;
    const erroresGraves = (erroresTodos || []).filter(e => e.gravedad === "grave").length;
    const erroresMenores = (erroresTodos || []).filter(e => e.gravedad === "menor").length;

    let html = `<div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:18px;">
      <div style="background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:14px;">
        <p style="font-size:12px; color:var(--ink-soft); margin:0 0 4px;">Horas cronometradas</p>
        <p style="font-size:22px; font-weight:600; margin:0;">${totalHoras.toFixed(1)}</p>
      </div>
      <div style="background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:14px;">
        <p style="font-size:12px; color:var(--ink-soft); margin:0 0 4px;">Registros cargados</p>
        <p style="font-size:22px; font-weight:600; margin:0;">${(registrosTodos || []).length}</p>
      </div>
      <div style="background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:14px;">
        <p style="font-size:12px; color:var(--ink-soft); margin:0 0 4px;">Rubros / tareas</p>
        <p style="font-size:22px; font-weight:600; margin:0;">${totalRubros} / ${totalTareas}</p>
      </div>
      <div style="background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:14px;">
        <p style="font-size:12px; color:var(--ink-soft); margin:0 0 4px;">Hs. perdidas en imprevistos</p>
        <p style="font-size:22px; font-weight:600; margin:0;">${totalImprevisto.toFixed(1)}</p>
      </div>
    </div>`;

    html += `<div style="background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:14px; margin-bottom:14px;">
      <p style="font-size:12px; color:var(--ink-soft); margin:0 0 8px;">Errores cargados</p>
      <p style="font-size:14px; margin:0;">🟠 ${erroresMenores} menores · 🔴 ${erroresGraves} graves</p>
    </div>`;

    html += `<p class="hint">Esta es la versión simple del panel. Todavía faltan las alertas automáticas, los objetivos y las comparaciones por rubro que fuimos definiendo — se suman en el próximo paso.</p>`;

    app.innerHTML = html;
  }

  // arranque
  cargarRubros();
</script>

</body>
</html>
