<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TM FIX — CRM Influencers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#14161a; --surface:#1c1f26; --surface2:#242832; --border:#323847;
    --text:#e9ebef; --text2:#9aa1b0; --text3:#6b7280;
    --gold:#d4a344; --gold-dim:#8a6d33;
    --teal:#2a9d8f; --teal-dim:#1c6a60;
    --coral:#e4572e; --coral-dim:#8a3319;
    --radius:10px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Space Grotesk', sans-serif;
    background:var(--bg); color:var(--text);
    min-height:100vh; padding:0;
  }
  .mono{font-family:'IBM Plex Mono', monospace;}
  header{
    padding:20px 28px; border-bottom:1px solid var(--border);
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px;
  }
  header h1{font-size:18px; font-weight:700; letter-spacing:0.3px;}
  header h1 span{color:var(--gold);}
  nav{display:flex; gap:4px; background:var(--surface); border-radius:999px; padding:4px; border:1px solid var(--border);}
  nav button{
    background:none; border:none; color:var(--text2); font-family:inherit; font-size:13px;
    padding:8px 16px; border-radius:999px; cursor:pointer; font-weight:500;
  }
  nav button.active{background:var(--gold); color:#1a1608;}
  main{padding:24px 28px; max-width:1200px; margin:0 auto;}

  .cards{display:grid; grid-template-columns:repeat(auto-fit, minmax(200px,1fr)); gap:14px; margin-bottom:24px;}
  .card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px;}
  .card .label{font-size:12px; color:var(--text2); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:8px;}
  .card .value{font-size:26px; font-weight:700; font-family:'IBM Plex Mono', monospace;}
  .card.money .value{color:var(--teal);}
  .card.alert .value{color:var(--coral);}

  .alerts-box{background:var(--surface); border:1px solid var(--coral-dim); border-radius:var(--radius); padding:16px 18px; margin-bottom:24px;}
  .alerts-box h3{font-size:13px; color:var(--coral); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:10px; display:flex; align-items:center; gap:8px;}
  .alert-row{display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-top:1px solid var(--border); font-size:13px;}
  .alert-row:first-of-type{border-top:none;}
  .alert-row .tag{font-size:11px; padding:2px 8px; border-radius:999px; background:var(--coral-dim); color:#ffc9b8; font-family:'IBM Plex Mono',monospace;}
  .alert-row .tag.warn{background:var(--gold-dim); color:#ffe4ad;}
  .alert-row .tag.compress{background:var(--teal-dim); color:#a6ecdf;}
  .empty-alerts{color:var(--text3); font-size:13px;}

  .toolbar{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; align-items:center;}
  input, select{
    background:var(--surface2); border:1px solid var(--border); color:var(--text);
    padding:9px 12px; border-radius:8px; font-family:inherit; font-size:13px;
  }
  input:focus, select:focus{outline:1px solid var(--gold); border-color:var(--gold);}
  .search{flex:1; min-width:180px;}
  button.primary{
    background:var(--gold); color:#1a1608; border:none; padding:10px 18px;
    border-radius:8px; font-family:inherit; font-weight:700; font-size:13px; cursor:pointer;
  }
  button.ghost{
    background:none; border:1px solid var(--border); color:var(--text2); padding:9px 14px;
    border-radius:8px; font-family:inherit; font-size:13px; cursor:pointer;
  }
  button.ghost:hover{border-color:var(--text2); color:var(--text);}

  table{width:100%; border-collapse:collapse; background:var(--surface); border-radius:var(--radius); overflow:hidden; border:1px solid var(--border);}
  th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:0.5px; color:var(--text2); padding:12px 14px; border-bottom:1px solid var(--border); background:var(--surface2);}
  td{padding:12px 14px; border-bottom:1px solid var(--border); font-size:13px; vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  tr.row-click{cursor:pointer;}
  tr.row-click:hover{background:var(--surface2);}
  .pct-bad{color:var(--coral); font-weight:600;}
  .pct-ok{color:var(--teal); font-weight:600;}
  .badge{font-size:11px; padding:3px 9px; border-radius:999px; font-family:'IBM Plex Mono',monospace; white-space:nowrap;}
  .badge.Standby{background:#3a3d24; color:#e0d98c;}
  .badge.Aprobado{background:var(--teal-dim); color:#a6ecdf;}
  .badge.Rechazado{background:var(--coral-dim); color:#ffc9b8;}
  .badge.EnCampaña{background:var(--gold-dim); color:#ffe4ad;}
  .badge.Pendiente{background:#3a3d24; color:#e0d98c;}
  .badge.Pedido{background:var(--gold-dim); color:#ffe4ad;}
  .badge.Recibido{background:var(--teal-dim); color:#a6ecdf;}
  .empty-state{text-align:center; padding:50px 20px; color:var(--text3);}

  .overlay{position:fixed; inset:0; background:rgba(0,0,0,0.6); display:flex; align-items:flex-start; justify-content:center; padding:40px 16px; overflow-y:auto; z-index:50;}
  .modal{background:var(--surface); border:1px solid var(--border); border-radius:14px; width:100%; max-width:640px; padding:26px;}
  .modal h2{font-size:16px; margin-bottom:18px; display:flex; justify-content:space-between; align-items:center;}
  .modal h2 .close{cursor:pointer; color:var(--text2); font-size:20px; line-height:1;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:11px; text-transform:uppercase; color:var(--text2); margin-bottom:6px; letter-spacing:0.4px;}
  .field input, .field select{width:100%;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .modal-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:20px;}

  .detail-section{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:20px; margin-bottom:18px;}
  .detail-section h3{font-size:13px; text-transform:uppercase; color:var(--text2); letter-spacing:0.5px; margin-bottom:14px;}
  .detail-header{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:20px; flex-wrap:wrap; gap:10px;}
  .detail-header h2{font-size:20px;}
  .detail-header a{color:var(--gold); font-size:13px; text-decoration:none;}
  .neg-item{border:1px solid var(--border); border-radius:8px; padding:14px; margin-bottom:10px; background:var(--surface2);}
  .neg-item-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
  .neg-item-top strong{font-size:14px;}
  .neg-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:10px; font-size:12px;}
  .neg-grid .k{color:var(--text3); display:block; margin-bottom:2px;}
  .neg-grid .v{font-family:'IBM Plex Mono',monospace;}
  .gain{color:var(--teal); font-weight:600;}
  .spread-bar{display:flex; height:6px; border-radius:999px; overflow:hidden; margin-top:10px; background:var(--border);}
  .spread-bar div{height:100%;}
  .back-link{color:var(--text2); font-size:13px; cursor:pointer; margin-bottom:16px; display:inline-block;}
  .back-link:hover{color:var(--text);}
  .muted{color:var(--text3); font-size:12px;}
  textarea{background:var(--surface2); border:1px solid var(--border); color:var(--text); padding:9px 12px; border-radius:8px; font-family:inherit; font-size:13px; width:100%; resize:vertical;}

  .chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:6px;}
  .chip{font-size:11px; padding:3px 10px; border-radius:999px; background:var(--surface2); border:1px solid var(--border); color:var(--text2); font-family:'IBM Plex Mono',monospace;}

  .table-scroll{overflow-x:auto; border-radius:var(--radius);}
  .table-scroll table{min-width:640px;}

  .header-actions{display:flex; gap:8px; align-items:center;}
  .header-actions button{font-size:12px; padding:8px 12px;}
  #btn-restore{display:none;}

  .portfolio-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:14px;}
  .portfolio-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px;}
  .portfolio-card h4{font-size:14px; margin-bottom:6px;}
  .portfolio-card .links{display:flex; gap:10px; margin-top:10px;}
  .portfolio-card .links a{color:var(--gold); font-size:12px; text-decoration:none;}

  .msg-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px; margin-bottom:12px;}
  .msg-card .msg-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
  .msg-card .msg-top strong{font-size:13px;}
  .msg-card p{font-size:13px; color:var(--text2); white-space:pre-wrap; line-height:1.5;}

  .contact-log{border-top:1px solid var(--border); margin-top:12px; padding-top:12px;}
  .contact-entry{font-size:12px; padding:6px 0; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; gap:10px;}
  .contact-entry:last-child{border-bottom:none;}
  .contact-entry .fecha{color:var(--text3); white-space:nowrap; font-family:'IBM Plex Mono',monospace;}

  .stat-preview{max-width:100%; max-height:220px; border-radius:8px; margin:12px 0; display:block;}
  .spinner{display:inline-block; width:14px; height:14px; border:2px solid var(--border); border-top-color:var(--gold); border-radius:50%; animation:spin 0.8s linear infinite; vertical-align:middle; margin-right:6px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .ia-note{font-size:11px; color:var(--text3); margin-top:4px;}

  .help-icon{display:inline-flex; align-items:center; justify-content:center; width:15px; height:15px; border-radius:50%; background:var(--surface2); border:1px solid var(--border); color:var(--text3); font-size:10px; cursor:pointer; margin-left:5px; vertical-align:middle; user-select:none;}
  .help-icon:hover{border-color:var(--gold); color:var(--gold);}
  .help-tooltip{display:none; position:fixed; background:var(--surface2); border:1px solid var(--gold-dim); border-radius:8px; padding:10px 12px; font-size:12px; color:var(--text2); max-width:260px; z-index:500; box-shadow:0 6px 20px rgba(0,0,0,0.5); line-height:1.5;}
  .help-tooltip.show{display:block;}

  .chat-box{display:flex; flex-direction:column; gap:12px; max-height:60vh; overflow-y:auto; padding:4px 4px 12px; margin-bottom:14px;}
  .chat-bubble{max-width:80%; padding:10px 14px; border-radius:14px; font-size:13px; line-height:1.6; white-space:pre-wrap;}
  .chat-bubble.user{align-self:flex-end; background:var(--gold); color:#1a1608; border-bottom-right-radius:4px;}
  .chat-bubble.model{align-self:flex-start; background:var(--surface2); border:1px solid var(--border); border-bottom-left-radius:4px;}
  .chat-input-row{display:flex; gap:10px;}
  .chat-input-row textarea{flex:1; resize:none;}

  @media print{
    header, .modal-actions, #btn-imprimir, #btn-edit-profile, #btn-delete-inf, #btn-compartir, #btn-desc-michael, .back-link, [data-edit-neg], [data-delete-neg], [data-msg-ia], [data-duplicar-neg], [data-new-reel], [data-new-tramo], [data-edit-reel], [data-edit-tramo], [data-new-contacto], [data-new-red], [data-edit-red], [data-delete-red]{display:none !important;}
    body{background:#fff; color:#000;}
    .detail-section{border-color:#ccc; page-break-inside:avoid;}
  }
  @media (max-width:600px){
    header{padding:16px;}
    main{padding:16px;}
    .grid2{grid-template-columns:1fr;}
    .modal{padding:18px;}
    .cards{grid-template-columns:repeat(2,1fr);}
    .toolbar{flex-direction:column; align-items:stretch;}
    .detail-header{flex-direction:column;}
    nav{width:100%; justify-content:space-between;}
    nav button{flex:1; text-align:center; padding:8px 4px;}
  }
</style>
</head>
<body>
<header>
  <h1>TM FIX <span>· CRM Influencers</span></h1>
  <nav id="nav">
    <button data-view="dashboard" class="active">Dashboard</button>
    <button data-view="pool">Pool</button>
    <button data-view="portfolio">Portfolio</button>
    <button data-view="mensajes">Mensajes</button>
    <button data-view="herramientas">Herramientas</button>
    <button data-view="asistente">Asistente</button>
  </nav>
  <div class="header-actions">
    <button class="primary" id="btn-ayuda-general">❓ Ayuda</button>
    <button class="ghost" id="btn-cambiar-pass">Cambiar contraseña</button>
    <button class="ghost" id="btn-logout">Cerrar sesión</button>
    <button class="ghost" id="btn-config-nube">Nube: <span id="nube-status">sin conectar</span></button>
    <button class="ghost" id="btn-config-ia">IA: <span id="ia-status">sin configurar</span></button>
    <button class="ghost" id="btn-backup">Backup</button>
    <button class="ghost" id="btn-restore-trigger">Restaurar</button>
    <input type="file" id="btn-restore" accept="application/json">
  </div>
</header>
<main id="main"></main>

<script>
function ayuda(texto){
  return `<span class="help-icon" data-help="${texto.replace(/"/g,'&quot;')}">?</span>`;
}

document.addEventListener('click', (e)=>{
  const existente = document.getElementById('help-tooltip-activo');
  if(existente) existente.remove();
  if(e.target.classList.contains('help-icon')){
    const tip = document.createElement('div');
    tip.id = 'help-tooltip-activo';
    tip.className = 'help-tooltip show';
    tip.textContent = e.target.dataset.help;
    document.body.appendChild(tip);
    const rect = e.target.getBoundingClientRect();
    const tipWidth = 260;
    let left = rect.left;
    if(left + tipWidth > window.innerWidth - 10) left = window.innerWidth - tipWidth - 10;
    tip.style.left = Math.max(10,left) + 'px';
    tip.style.top = (rect.bottom + 6) + 'px';
    e.stopPropagation();
  }
});

const CATEGORIAS = ["Fútbol","Memes","Entretenimiento","Streamers","Otro"];
const PAISES = ["Argentina","Perú","México","Colombia","Chile","Ecuador","Otro"];
const PLATAFORMAS = ["Instagram","TikTok","YouTube","Facebook","Twitter/X","Kick","Twitch","Otra"];
const FUENTES = ["Búsqueda directa","Madriguera de conejo (sugeridas)","Comentarios","TikTok cruzado","Otra plataforma paga","Recomendado por otro influencer","Otro"];
const ESTADOS = ["Standby","Aprobado","Rechazado","En Campaña"];
const MEDIOS_PAGO = ["Binance Pay ID","USDT TRC20","CBU/CVU","Lemon Cash","Transferencia","Otro"];
const ESTADOS_PAGO = ["Pendiente","Enviado","Confirmado"];
const MIN_SEGUIDORES = 100000;
const MIN_VISTA_REEL = 50000;

const HERRAMIENTAS = [
  {nombre:"Modash", url:"https://www.modash.io", desc:"Búsqueda de influencers con filtro de audiencia por género, país y edad. Estimación sin pedir capturas."},
  {nombre:"HypeAuditor", url:"https://hypeauditor.com", desc:"Reportes de audiencia y detección de seguidores falsos. Tiene reportes gratuitos limitados."},
  {nombre:"Heepsy", url:"https://www.heepsy.co", desc:"Búsqueda por nicho, país y rango de seguidores, con estimación de audiencia."}
];

const NICHOS_BUSQUEDA = [
  {nombre:"Fútbol (el más seguro, ~90% hombres)", palabras:["out of context fútbol","resumen goles","memes termo","fútbol picante","la 12","gallinas","ascenso","futbol peruano memes"]},
  {nombre:"Shitpost / Memes", palabras:["shitpost arg","memes random","humor negro","videos graciosos"]},
  {nombre:"Autos y motos (~100% hombres jóvenes)", palabras:["fierreros","motos al piso","tuning"]},
  {nombre:"Gaming / Streamers", palabras:["clips de streamers","resumen de streams"]}
];

const PLANTILLAS_DEFAULT = [
  {id:'p1', titulo:"Paso 1: El Gancho (primer contacto)", texto:"¡Hola! ¿Cómo estás? Soy Wilson, me pongo en contacto con vos para ofrecerte una colaboración publicitaria súper sencilla.\nTrabajo con las casas de apuestas mejor posicionadas y que mejor pagan (1xBet, Stake, Betsson, etc.). Vi tu perfil y creo que encaja perfecto. Si te interesa escuchar de qué se trata y generar un ingreso sin tener que cambiar el estilo de tu contenido, avisame y te cuento rapidito. ¡Abrazo!"},
  {id:'p2', titulo:"Paso 2: La Dinámica y el Filtro de Seguridad", texto:"¡Excelente! Te cuento cómo es la dinámica: es súper simple. Solo tenés que colocar un pequeño logo de la marca en cualquier parte de tu video por unos 6 o 7 segundos. No tenés que hablar, ni promocionarla oralmente, solo dejar el logo a la vista.\nAntes de avanzar, te hago una pregunta clave para ver con qué marca te asignamos: ¿Trabajaste con 1xBet en los últimos 3 meses? (Si ya colaboraste con ellos hace menos de 3 meses, no podríamos hacerlo ahora mismo, pero te guardo para otra de las plataformas. Y si tenés otra cuenta secundaria, ¡también sirve!)"},
  {id:'p3', titulo:"Paso 3: El Cierre (pedir métricas para cotizar)", texto:"¡Perfecto entonces, estamos listos! Para poder pasarte la cotización exacta y decirte cuánto te vamos a pagar, necesito que me mandes una captura de pantalla de tus estadísticas de Instagram.\nPor favor, pasame las capturas de: Edad, Países y Género (es un requisito de la marca que el público sea al menos 60% hombres). Apenas me mandes esas fotos, lo envío directo para que me aprueben tu presupuesto y te paso el número. ¡Quedo a la espera!"},
  {id:'p4', titulo:"Pedido de capturas", texto:"Hola! Para avanzar con la propuesta necesito que me mandes las capturas de tus estadísticas: género, edad y país de tu audiencia (en Instagram: Perfil profesional > Estadísticas de la audiencia)."},
  {id:'p5', titulo:"Perfil aprobado", texto:"Buenas noticias! Tu perfil fue aprobado. El presupuesto para esta campaña es de $[MONTO]. El video debe insertar el logo de la marca por 6-7 segundos, sin guion verbal, sin política ni religión. ¿Te sirve ese monto?"},
  {id:'p6', titulo:"Contraoferta", texto:"Entiendo tu propuesta. Del lado de la marca el máximo que puedo mover es $[MONTO]. ¿Cerramos en ese número?"},
  {id:'p7', titulo:"Perfil rechazado (guardar contacto)", texto:"Che, esta vez la marca no aprobó tu perfil por [MOTIVO]. Igual te dejo guardado por si surge otra campaña que te calce mejor."},
  {id:'p8', titulo:"Pedido de reenvío del video", texto:"Antes de que se cumplan los 15 días y Instagram borre el video publicitario, ¿me podés pasar el MP4 original? Lo necesito para mi archivo de casos."},
  {id:'p9', titulo:"Recordatorio de pago enviado", texto:"Te acabo de enviar el pago de $[MONTO] por [MEDIO]. Cualquier cosa avisame."}
];

let state = { influencers: [], view: "dashboard", detailId: null };

function migrate(inf){
  inf.etiquetas = inf.etiquetas || [];
  inf.seguidores = inf.seguidores || '';
  inf.vista_reel_min = inf.vista_reel_min || '';
  inf.historial_estadisticas = inf.historial_estadisticas || [];
  inf.codigo_promocional = inf.codigo_promocional || '';
  inf.logo_link = inf.logo_link || '';
  inf.redes = inf.redes || [];
  if(!inf.historial_contacto){
    inf.historial_contacto = [];
    if(inf.ultimo_contacto_fecha){
      inf.historial_contacto.push({fecha:inf.ultimo_contacto_fecha, nota:inf.ultimo_contacto_nota||''});
    }
  }
  inf.negociaciones = (inf.negociaciones||[]).map(neg=>{
    neg.num_reels = neg.num_reels || 5;
    neg.modalidad_pago = neg.modalidad_pago || '50/50';
    neg.tramos = neg.tramos || [];
    if(!inf.codigo_promocional && neg.codigo_promocional) inf.codigo_promocional = neg.codigo_promocional;
    if(!inf.logo_link && neg.logo_link) inf.logo_link = neg.logo_link;
    if(!neg.reels){
      neg.reels = [];
      if(inf.evidencia && (inf.evidencia.link_reel || inf.evidencia.fecha_publicacion)){
        neg.reels.push({id:uid(), numero:1, fecha_publicacion:inf.evidencia.fecha_publicacion||'', link_reel:inf.evidencia.link_reel||'', link_video_descargado:inf.evidencia.link_video_descargado||'', pagado:false, monto_pagado:''});
      }
    }
    return neg;
  });
  return inf;
}

function precalificacion(inf){
  const seg = Number(inf.seguidores);
  const vista = Number(inf.vista_reel_min);
  if(!inf.seguidores || !inf.vista_reel_min) return {estado:'Sin datos', motivo:''};
  if(seg >= MIN_SEGUIDORES && vista >= MIN_VISTA_REEL) return {estado:'Precalificado', motivo:''};
  const motivos = [];
  if(seg < MIN_SEGUIDORES) motivos.push(`menos de ${MIN_SEGUIDORES.toLocaleString('es-AR')} seguidores`);
  if(vista < MIN_VISTA_REEL) motivos.push(`su reel más bajo no llega a ${MIN_VISTA_REEL.toLocaleString('es-AR')} vistas`);
  return {estado:'Descartado', motivo: motivos.join(' y ')};
}

function estaOcupado(inf){
  return (inf.negociaciones||[]).some(n=>['Standby','Aprobado','En Campaña'].includes(n.estado));
}

function sugerenciaReescribir(inf){
  const hist = inf.historial_contacto||[];
  if(!hist.length || estaOcupado(inf)) return '';
  const ultimo = hist.slice().sort((a,b)=>(a.fecha||'').localeCompare(b.fecha||''))[hist.length-1];
  if(!ultimo.fecha) return '';
  const dias = daysBetween(ultimo.fecha, todayStr());
  if(dias < 3) return `<p class="ia-note" style="margin-top:8px">Le escribiste hace ${dias} día${dias===1?'':'s'} — dale un poco más de margen antes de insistir.</p>`;
  if(dias >= 3 && dias <= 6) return `<p class="ia-note" style="margin-top:8px"><span class="gain">Buen momento para reescribirle</span> — pasaron ${dias} días sin respuesta.</p>`;

function revisarDatosIncompletos(){
  const problemas = [];
  state.influencers.forEach(inf=>{
    (inf.negociaciones||[]).forEach(neg=>{
      if((neg.estado==='Aprobado'||neg.estado==='En Campaña') && !neg.presupuesto_marca){
        problemas.push(`${inf.usuario_ig} — negociación con ${neg.marca} está ${neg.estado} pero sin presupuesto cargado`);
      }
      if((neg.estado==='Aprobado'||neg.estado==='En Campaña') && !neg.pago_final){
        problemas.push(`${inf.usuario_ig} — negociación con ${neg.marca} sin pago final acordado`);
      }
      if(neg.estado_pago==='Confirmado' && !neg.medio_pago){
        problemas.push(`${inf.usuario_ig} — pago marcado como confirmado pero sin medio de pago`);
      }
    });
    if(!inf.contacto) problemas.push(`${inf.usuario_ig} — sin dato de contacto cargado`);
  });
  return problemas;
}

function downloadBackup(){
  const problemas = revisarDatosIncompletos();
  if(problemas.length){
    const verMas = problemas.length>5 ? `\n...y ${problemas.length-5} más.` : '';
    if(!confirm(`Antes de bajar el backup, encontré ${problemas.length} dato(s) incompleto(s):\n\n${problemas.slice(0,5).join('\n')}${verMas}\n\n¿Bajar el backup igual?`)) return;
  }
  const blob = new Blob([JSON.stringify(state.influencers, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `backup-influencers-${todayStr()}.json`; a.click();
  URL.revokeObjectURL(url);
}

function restoreBackup(file){
  const reader = new FileReader();
  reader.onload = async (e)=>{
    try{
      const data = JSON.parse(e.target.result);
      if(!Array.isArray(data)) throw new Error('Formato inválido');
      if(!confirm(`Se van a reemplazar los ${state.influencers.length} influencers actuales por los ${data.length} del backup. ¿Continuar?`)) return;
      state.influencers = data.map(migrate);
      await saveData();
      render();
    }catch(err){
      alert('El archivo no es un backup válido.');
    }
  };
  reader.readAsText(file);
}

async function llamarGemini(prompt, base64, mediaType){
  const key = await getGeminiKey();
  if(!key){
    throw new Error('SIN_CLAVE');
  }
  const parts = [];
  if(base64) parts.push({inline_data: {mime_type: mediaType, data: base64}});
  parts.push({text: prompt});
  const modelo = getGeminiModel();
  const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelo}:generateContent`, {
    method: "POST",
    headers: {"Content-Type": "application/json", "X-goog-api-key": key},
    body: JSON.stringify({ contents: [{ parts }] })
  });
  const data = await response.json();
  if(data.error) throw new Error(data.error.message || 'Error de Gemini');
  const text = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
  return text;
}

async function analizarConGemini(base64, mediaType, prompt){
  return llamarGemini(prompt, base64, mediaType);
}

    method: "POST",

    body: JSON.stringify({
      system_instruction: { parts: [{text: systemPrompt}] },
      contents
    })
  });
  const data = await response.json();
  if(data.error) throw new Error(data.error.message || 'Error de Gemini');
  const text = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
  return text;
}

function uid(){ return Math.random().toString(36).slice(2,10); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function daysBetween(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }
function money(n){ return '$' + (Number(n)||0).toLocaleString('es-AR'); }

function getAlerts(){
  const alerts = [];
  const today = todayStr();
  state.influencers.forEach(inf=>{
    (inf.negociaciones||[]).forEach(neg=>{
      if(neg.estado==='Standby' && neg.fecha && daysBetween(neg.fecha, today) >= 7){
        alerts.push({tipo:'warn', texto:`${inf.usuario_ig} — negociación con ${neg.marca} en standby hace ${daysBetween(neg.fecha, today)} días`, infId: inf.id});
      }
      if(neg.estado_pago==='Pendiente' && (neg.estado==='Aprobado' || neg.estado==='En Campaña')){
        alerts.push({tipo:'pago', texto:`${inf.usuario_ig} — pago pendiente de ${money(neg.pago_final)} (${neg.marca})`, infId: inf.id});
      }
      const reels = neg.reels||[];
      reels.forEach(r=>{
        if(r.fecha_publicacion && !r.link_video_descargado){
          const dias = daysBetween(r.fecha_publicacion, today);
          const restante = 15 - dias;
          if(restante <= 3){
            alerts.push({tipo:'video', texto:`${inf.usuario_ig} — reel ${r.numero} de ${neg.marca}: quedan ${restante<0?0:restante} días para descargarlo`, infId: inf.id});
          }
        }
        if(r.link_video_descargado && !r.comprimido && r.fecha_publicacion && daysBetween(r.fecha_publicacion, today) >= 30){
          alerts.push({tipo:'compress', texto:`${inf.usuario_ig} — reel ${r.numero} de ${neg.marca}: pasaron ${daysBetween(r.fecha_publicacion, today)} días, andá comprimiéndolo y archivándolo`, infId: inf.id});
        }
      });
      const numReels = Number(neg.num_reels)||5;
      if(neg.estado==='En Campaña' && reels.length && reels.length < numReels){
        const ultimo = reels.slice().sort((a,b)=>(a.fecha_publicacion||'').localeCompare(b.fecha_publicacion||''))[reels.length-1];
        if(ultimo.fecha_publicacion && daysBetween(ultimo.fecha_publicacion, today) > 2){
          alerts.push({tipo:'warn', texto:`${inf.usuario_ig} — sin subir reel nuevo hace ${daysBetween(ultimo.fecha_publicacion, today)} días (${reels.length}/${numReels} de ${neg.marca})`, infId: inf.id});
        }
      }
      const tramos = neg.tramos||[];
      if((neg.estado==='Aprobado'||neg.estado==='En Campaña') && reels.length>0 && tramos.some(t=>t.estado==='Pendiente')){
        const pendiente = tramos.find(t=>t.estado==='Pendiente');
        alerts.push({tipo:'pago', texto:`${inf.usuario_ig} — ya subió reels, pedile a Michael el tramo de ${money(pendiente.monto)} de ${neg.marca}`, infId: inf.id});
      }
    });
    if(inf.historial_contacto && inf.historial_contacto.length && !estaOcupado(inf)){
      const ultimoContacto = inf.historial_contacto.slice().sort((a,b)=>(a.fecha||'').localeCompare(b.fecha||''))[inf.historial_contacto.length-1];
      const yaFueAprobado = (inf.negociaciones||[]).some(n=>n.estado==='Aprobado'||n.estado==='En Campaña');
      if(ultimoContacto.fecha && daysBetween(ultimoContacto.fecha, today) >= 14 && !yaFueAprobado){
        alerts.push({tipo:'warn', texto:`${inf.usuario_ig} — se enfrió, hace ${daysBetween(ultimoContacto.fecha, today)} días sin novedades. Reintentar o descartar.`, infId: inf.id});
      }
    }
    (inf.redes||[]).forEach(r=>{
      if(r.activa!==false && r.fecha_actualizacion && daysBetween(r.fecha_actualizacion, today)>=90){
        alerts.push({tipo:'warn', texto:`${inf.usuario_ig} — su cuenta de ${r.plataforma} (${r.usuario||'sin usuario'}) tiene datos de hace ${daysBetween(r.fecha_actualizacion, today)} días, capaz conviene actualizarlos.`, infId: inf.id});
      }
    });
    if(inf.cooldown_hasta && inf.cooldown_hasta <= today && !estaOcupado(inf)){
      alerts.push({tipo:'compress', texto:`${inf.usuario_ig} — ya venció el cooldown con la otra marca, lo podés reofrecer.`, infId: inf.id});
    }
  });
  return alerts;
}

function totalGanancia(){
  let t = 0;
  state.influencers.forEach(inf=>{
    (inf.negociaciones||[]).forEach(neg=>{
      if(neg.estado==='Aprobado' || neg.estado==='En Campaña'){
        t += (Number(neg.presupuesto_marca)||0) - (Number(neg.pago_final)||0);
      }
    });
  });
  return t;
}

function totalAprobados(){
  return state.influencers.filter(inf => (inf.negociaciones||[]).some(n=>n.estado==='Aprobado'||n.estado==='En Campaña')).length;
}

function datosSemana(){
  const hoy = todayStr();
  const hace7 = new Date(); hace7.setDate(hace7.getDate()-7);
  const hace7str = hace7.toISOString().slice(0,10);
  let ganancia = 0, reelsSubidos = 0, nuevasNegociaciones = 0;
  state.influencers.forEach(inf=>{
    (inf.negociaciones||[]).forEach(neg=>{
      if(neg.fecha && neg.fecha >= hace7str) nuevasNegociaciones++;
      (neg.reels||[]).forEach(r=>{
        if(r.fecha_publicacion && r.fecha_publicacion >= hace7str){
          reelsSubidos++;
          if(neg.estado==='Aprobado'||neg.estado==='En Campaña'){
            const numReels = Number(neg.num_reels)||5;
            ganancia += ((Number(neg.presupuesto_marca)||0)-(Number(neg.pago_final)||0)) / numReels;
          }
        }
      });
    });
  });
  const alertas = getAlerts();
  return { ganancia: Math.round(ganancia), reelsSubidos, nuevasNegociaciones, alertasPendientes: alertas.length };
}

function lastNeg(inf){
  const negs = inf.negociaciones||[];
  if(!negs.length) return null;
  return negs[negs.length-1];
}

function render(){
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active', b.dataset.view===state.view));
  const main = document.getElementById('main');
  if(state.view==='dashboard') main.innerHTML = renderDashboard();
  else if(state.view==='pool') main.innerHTML = renderPool();
  else if(state.view==='detail') main.innerHTML = renderDetail();
  else if(state.view==='portfolio') main.innerHTML = renderPortfolio();
  else if(state.view==='mensajes') main.innerHTML = renderMensajes();
  else if(state.view==='herramientas') main.innerHTML = renderHerramientas();
  else if(state.view==='asistente'){ main.innerHTML = renderAsistente(); setTimeout(()=>{ const box=document.getElementById('chat-box'); if(box) box.scrollTop = box.scrollHeight; },0); }
  attachEvents();
}

function renderTable(){
  const cat = document.getElementById('f-cat')?.value || '';
  const estado = document.getElementById('f-estado')?.value || '';
  const preca = document.getElementById('f-preca')?.value || '';
  const plataforma = document.getElementById('f-plataforma')?.value || '';
  const search = document.getElementById('f-search')?.value?.toLowerCase() || '';

  let rows = state.influencers.filter(inf=>{
    if(cat && inf.categoria !== cat) return false;
    if(search){
      const enPrincipal = inf.usuario_ig.toLowerCase().includes(search);
      const enRedes = (inf.redes||[]).some(r=>(r.usuario||'').toLowerCase().includes(search));
      if(!enPrincipal && !enRedes) return false;
    }
    if(plataforma==='Instagram'){
      // la cuenta principal siempre es Instagram, así que pasa siempre
    }else if(plataforma && !(inf.redes||[]).some(r=>r.plataforma===plataforma)) return false;
    if(preca==='Cartera' && !esCarteraDisponible(inf)) return false;
    else if(preca && preca!=='Cartera' && precalificacion(inf).estado !== preca) return false;
    if(estado){
      const ln = lastNeg(inf);
      if(!ln || ln.estado !== estado) return false;
    }
    return true;
  });
  state.ultimoFiltroPool = rows;

  if(!rows.length){
    return `<div class="empty-state">No hay influencers que coincidan con estos filtros.</div>`;
  }

  return `
    ${state.poolSeleccionados && state.poolSeleccionados.size ? `
      <div class="alerts-box" style="margin-bottom:14px; border-color:var(--gold-dim);">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>${state.poolSeleccionados.size} seleccionado${state.poolSeleccionados.size>1?'s':''}</span>
          <span>
            ${state.poolSeleccionados.size>=2 && state.poolSeleccionados.size<=3 ? `<button class="ghost" id="btn-comparar">Comparar seleccionados</button>` : ''}
            <button class="primary" id="btn-generar-lista">Generar lista para Michael</button>
            <button class="ghost" id="btn-limpiar-seleccion" style="margin-left:8px;">Limpiar selección</button>
          </span>
        </div>
      </div>
    ` : ''}
    <div class="table-scroll">
    <table>
      <thead><tr>
        <th></th><th></th><th>Usuario IG</th><th>Categoría</th><th>% Masculino</th><th>Precalificación</th><th>Prioridad</th><th>Último estado</th><th>Marca</th>
      </tr></thead>
      <tbody>
        ${rows.map(inf=>{
          const ln = lastNeg(inf);
          const pct = inf.publico_masculino_pct;
          const pctClass = pct < 60 ? 'pct-bad' : 'pct-ok';
          const pre = precalificacion(inf);
          const preClass = pre.estado==='Precalificado' ? 'gain' : pre.estado==='Descartado' ? 'pct-bad' : 'muted';
          const marcado = state.poolSeleccionados && state.poolSeleccionados.has(inf.id);
          return `<tr class="row-click" data-open="${inf.id}">
            <td style="width:30px" onclick="event.stopPropagation()"><input type="checkbox" data-seleccionar="${inf.id}" ${marcado?'checked':''} style="width:auto"></td>
            <td style="width:36px">${inf.foto_url ? `<img src="${inf.foto_url}" style="width:28px; height:28px; border-radius:50%; object-fit:cover; vertical-align:middle;">` : `<span style="display:inline-block; width:28px; height:28px; border-radius:50%; background:var(--surface2); text-align:center; line-height:28px; font-size:11px; color:var(--text3);">${(inf.usuario_ig||'?').replace('@','').charAt(0).toUpperCase()}</span>`}</td>
            <td>${inf.usuario_ig}</td>
            <td>${inf.categoria||'—'}</td>
            <td class="${preClass}">${pre.estado}</td>
            <td class="mono ${pctClass}">${pct!==undefined && pct!==''? pct+'%':'—'}</td>
            <td>${inf.prioridad||'—'}</td>
            <td>${ln ? `<span class="badge ${ln.estado.replace(' ','')}">${ln.estado}</span>` : '<span class="muted">Sin negociación</span>'}</td>
            <td>${ln ? ln.marca : '—'}</td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
    </div>
  `;
}

function renderPortfolio(){
  const casos = [];
  state.influencers.forEach(inf=>{
    (inf.negociaciones||[]).forEach(neg=>{
      const reelsConVideo = (neg.reels||[]).filter(r=>r.link_video_descargado);
      if(reelsConVideo.length){
        const ganancia = (Number(neg.presupuesto_marca)||0)-(Number(neg.pago_final)||0);
        casos.push({inf, neg, reelsConVideo, ganancia});
      }
    });
  });
  if(!casos.length){
    return `<div class="empty-state">Todavía no hay casos de éxito con video descargado. Se van a listar acá apenas cargues un "Link video descargado" en algún reel de una negociación.</div>`;
  }
  return `
    <div class="portfolio-grid">
      ${casos.map((c,i)=>`
        <div class="portfolio-card">
          <h4>${c.inf.usuario_ig}</h4>
          <div class="muted">${c.inf.categoria||'Sin categoría'} · ${c.neg.marca}</div>
          <div class="gain" style="margin-top:8px">Ganancia: ${money(c.ganancia)}</div>
          <div class="muted" style="margin-top:6px">${c.reelsConVideo.length} de ${c.neg.num_reels||5} reels guardados</div>
          <div class="links">
            ${c.reelsConVideo.map(r=>`<a href="${r.link_video_descargado}" target="_blank">Reel ${r.numero}</a>`).join('')}
          </div>
          <button class="ghost" style="margin-top:10px; font-size:11px; padding:5px 10px;" data-caso-exito="${i}">Redactar caso de éxito con IA</button>
          <div id="caso-status-${i}" class="ia-note"></div>
          <textarea id="caso-texto-${i}" rows="4" style="display:none; margin-top:8px; font-size:12px;"></textarea>

}

function openPlantillaModal(existing){
  const p = existing || {id:uid(), titulo:'', texto:''};
  const overlay = document.createElement('div');
  overlay.className='overlay';
  overlay.innerHTML = `
    <div class="modal">
      <h2>${existing?'Editar plantilla':'Nueva plantilla'} <span class="close" id="modal-close">×</span></h2>
      <div class="field"><label>Título</label><input id="pl-titulo" value="${p.titulo}"></div>
      <div class="field"><label>Texto</label><textarea id="pl-texto" rows="6">${p.texto}</textarea></div>
      <p class="ia-note">Podés usar [MONTO], [MEDIO], [MOTIVO] como marcadores para completar antes de enviar.</p>
      <div class="modal-actions">
        <button class="ghost" id="modal-cancel">Cancelar</button>
        <button class="primary" id="modal-save">Guardar</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  document.getElementById('modal-close').onclick = ()=>overlay.remove();
  document.getElementById('modal-cancel').onclick = ()=>overlay.remove();
  document.getElementById('modal-save').onclick = async ()=>{
    p.titulo = document.getElementById('pl-titulo').value.trim();
    p.texto = document.getElementById('pl-texto').value.trim();
    if(!p.titulo || !p.texto){ alert('Completá título y texto'); return; }
    if(!existing) state.plantillas.push(p);
    await savePlantillas();
    overlay.remove();
    render();
  };
}

function renderHerramientas(){
  const casos = [];
  state.influencers.forEach(inf=>{
    (inf.negociaciones||[]).forEach(neg=>{
      if(neg.estado==='Aprobado' || neg.estado==='En Campaña'){
        casos.push({inf, neg});
      }
    });
  });
  casos.sort((a,b)=>(Number(a.inf.seguidores)||0)-(Number(b.inf.seguidores)||0));

  const desde = document.getElementById('cot-desde')?.value || '';
  const hasta = document.getElementById('cot-hasta')?.value || '';
  const casosFiltrados = casos.filter(c=>{
    if(desde && (!c.neg.fecha || c.neg.fecha < desde)) return false;
    if(hasta && (!c.neg.fecha || c.neg.fecha > hasta)) return false;
    return true;
  });

  // Ganancia por mes
  const porMes = {};
  state.influencers.forEach(inf=>{
    (inf.negociaciones||[]).forEach(neg=>{
      if(neg.estado!=='Aprobado' && neg.estado!=='En Campaña') return;
      (neg.reels||[]).forEach(r=>{
        if(!r.fecha_publicacion) return;
        const mes = r.fecha_publicacion.slice(0,7);
        const numReels = Number(neg.num_reels)||5;
        const gananciaPorReel = ((Number(neg.presupuesto_marca)||0)-(Number(neg.pago_final)||0))/numReels;
        porMes[mes] = (porMes[mes]||0) + gananciaPorReel;
      });
    });
  });
  const meses = Object.keys(porMes).sort();
  const maxMes = Math.max(1, ...meses.map(m=>porMes[m]));

  // Vista por marca
  const porMarca = {};
  state.influencers.forEach(inf=>{
    (inf.negociaciones||[]).forEach(neg=>{
      if(!neg.marca) return;
      if(!porMarca[neg.marca]) porMarca[neg.marca] = {gastado:0, cantidad:0};
      if(neg.estado==='Aprobado'||neg.estado==='En Campaña'){
        porMarca[neg.marca].gastado += Number(neg.presupuesto_marca)||0;
        porMarca[neg.marca].cantidad++;
      }
    });
  });

  // Próximos reels esperados (campañas activas)
  const proximosReels = [];
  state.influencers.forEach(inf=>{
    (inf.negociaciones||[]).forEach(neg=>{
      if(neg.estado!=='En Campaña') return;
      const reels = (neg.reels||[]).slice().sort((a,b)=>(a.fecha_publicacion||'').localeCompare(b.fecha_publicacion||''));
      const numReels = Number(neg.num_reels)||5;
      if(reels.length && reels.length < numReels){
        const ultima = reels[reels.length-1].fecha_publicacion;
        if(ultima){
          const esperado = new Date(ultima); esperado.setDate(esperado.getDate()+2);
          proximosReels.push({inf, neg, fechaEsperada: esperado.toISOString().slice(0,10), numero: reels.length+1});
        }
      }
    });
  });
  proximosReels.sort((a,b)=>a.fechaEsperada.localeCompare(b.fechaEsperada));

  return `
    <p class="muted" style="margin-bottom:16px">Plataformas pagas para buscar influencers con filtro de audiencia (género, país, edad) sin tener que pedir capturas una por una. Para usarlas necesitás crear una cuenta — te conviene hacerlo con el correo de la empresa cuando lo tengas.</p>
    ${HERRAMIENTAS.map(h=>`
      <div class="msg-card">
        <div class="msg-top"><strong>${h.nombre}</strong><a href="${h.url}" target="_blank"><button class="primary">Entrar</button></a></div>
        <p>${h.desc}</p>
      </div>
    `).join('')}

    <h3 style="font-size:13px; text-transform:uppercase; color:var(--text2); margin:28px 0 12px;">Guía de búsqueda por nichos</h3>
    <p class="muted" style="margin-bottom:14px">Nichos con audiencia mayormente masculina (70-90%). Buscá estas palabras en la lupa de Instagram, según el país.</p>
    ${NICHOS_BUSQUEDA.map(n=>`
      <div class="msg-card">
        <div class="msg-top"><strong>${n.nombre}</strong></div>
        <div class="chips" style="margin-top:6px">
          ${n.palabras.map(p=>`<span class="chip" style="cursor:pointer" data-copy-palabra="${p}" title="Copiar">${p}</span>`).join('')}
        </div>
      </div>
    `).join('')}

    <div class="msg-card">
      <div class="msg-top"><strong>Técnica "madriguera de conejo"</strong></div>
      <p>Encontrá UNA cuenta buena del nicho → entrá a su perfil → tocá el ícono de "Cuentas sugeridas" (persona con +) al lado de Seguir → Instagram te tira ~20 cuentas parecidas, mismo país y nicho. Repetilo con las nuevas para encadenar. Hacelo con una cuenta de Instagram aparte para prospección, no la personal ni la del negocio — si no, le desordenás el algoritmo a la tuya.</p>
    </div>

    <div class="msg-card">
      <div class="msg-top"><strong>Filtro visual de 10 segundos (antes de anotarla)</strong></div>
      <p>
        · Últimos 6 posts: ¿algo de política o religión? Si está limpio, avanza.<br>
        · Mirá las <strong>vistas de los reels</strong>, no solo seguidores — si tiene muchos seguidores pero pocas vistas, es cuenta inactiva o con bots.<br>
        · Mirá los comentarios: si son puros emojis repetidos, puede ser actividad falsa aunque parezca movida.<br>
        · Revisá los "Destacados" (Highlights) del perfil — si tiene uno de "Colabs" o "Marcas", ahí confirmás si ya trabajó con otra casa de apuestas hace menos de 3 meses, antes de escribirle.<br>
        · Si también tiene TikTok, cruzalo — ahí las vistas se ven todavía más claras.
      </p>
    </div>

    <div class="msg-card">
      <div class="msg-top"><strong>Otros tips</strong></div>
      <p>
        · Mirá quién comenta seguido — a veces son otras cuentas del mismo nicho que ni te aparecen sugeridas.<br>
        · Sesiones de 20-30 minutos, un par de veces al día — mucho scrolleo y clics seguidos de una sentada puede disparar alguna verificación de seguridad de Instagram.<br>
        · Anotá el usuario en el CRM apenas lo ves, aunque sea sin todos los datos — completalo después con calma.
      </p>
    </div>

    <h3 style="font-size:13px; text-transform:uppercase; color:var(--text2); margin:28px 0 12px;">Ganancia por mes</h3>
    ${meses.length ? `
      <div class="msg-card">
        <div style="display:flex; align-items:flex-end; gap:10px; height:120px;">
          ${meses.map(m=>`
            <div style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%;">
              <div style="font-size:10px; margin-bottom:4px;" class="mono gain">${money(Math.round(porMes[m]))}</div>
              <div style="width:100%; background:var(--gold); border-radius:4px 4px 0 0; height:${Math.max(4,(porMes[m]/maxMes)*90)}px;"></div>
              <div style="font-size:10px; margin-top:4px;" class="muted">${m}</div>
            </div>
          `).join('')}
        </div>
      </div>
    ` : '<p class="empty-state">Todavía no hay reels publicados en negociaciones aprobadas para graficar.</p>'}

    <h3 style="font-size:13px; text-transform:uppercase; color:var(--text2); margin:28px 0 12px;">Vista por marca</h3>
    ${Object.keys(porMarca).length ? `
      <div class="table-scroll">
      <table>
        <thead><tr><th>Marca</th><th>Influencers aprobados</th><th>Total gastado</th></tr></thead>
        <tbody>
          ${Object.keys(porMarca).map(m=>`
            <tr><td>${m}</td><td class="mono">${porMarca[m].cantidad}</td><td class="mono gain">${money(porMarca[m].gastado)}</td></tr>
          `).join('')}
        </tbody>
      </table>
      </div>
    ` : '<p class="empty-state">Todavía no hay negociaciones cargadas.</p>'}

    <h3 style="font-size:13px; text-transform:uppercase; color:var(--text2); margin:28px 0 12px;">Calculadora rápida</h3>
    <div class="msg-card">
      <div class="grid2">
        <div class="field"><label>Presupuesto de la marca ($)</label><input id="calc-presupuesto" type="number"></div>
        <div class="field"><label>Pago al influencer ($)</label><input id="calc-pago" type="number"></div>
      </div>
      <div id="calc-resultado" class="ia-note" style="font-size:16px; margin-top:8px;"></div>
    </div>

    <h3 style="font-size:13px; text-transform:uppercase; color:var(--text2); margin:28px 0 12px;">Próximos reels esperados</h3>
    ${proximosReels.length ? proximosReels.map(p=>`
      <div class="msg-card">
        <div class="msg-top"><strong>${p.inf.usuario_ig}</strong><span class="muted">${p.neg.marca}</span></div>
        <p>Reel ${p.numero} esperado alrededor del <strong>${p.fechaEsperada}</strong> (según la cadencia de los anteriores)</p>
      </div>
    `).join('') : '<p class="empty-state">No hay campañas activas con reels pendientes de calcular.</p>'}

    <h3 style="font-size:13px; text-transform:uppercase; color:var(--text2); margin:28px 0 12px;">Notas internas</h3>
    <div class="msg-card">
      <textarea id="notas-generales" rows="6" placeholder="Anotaciones sueltas, ideas, recordatorios generales...">${state.notasGenerales||''}</textarea>
      <button class="primary" id="btn-guardar-notas" style="margin-top:10px;">Guardar notas</button>
      <span id="notas-status" class="ia-note"></span>
    </div>

    <h3 style="font-size:13px; text-transform:uppercase; color:var(--text2); margin:28px 0 12px;">Análisis de cotización</h3>
    <p class="muted" style="margin-bottom:10px">Tus negociaciones aprobadas, ordenadas de menor a mayor cantidad de seguidores, para que veas a ojo cómo se mueve el presupuesto que aprueba Michael. Esto NO calcula ningún patrón solo — es una vista ordenada para que vos lo analices.</p>
    <div class="toolbar" style="margin-bottom:14px;">
      <div class="field" style="margin:0;"><label>Desde</label><input id="cot-desde" type="date" value="${desde}"></div>
      <div class="field" style="margin:0;"><label>Hasta</label><input id="cot-hasta" type="date" value="${hasta}"></div>
    </div>
    ${casosFiltrados.length ? `
      <div class="table-scroll">
      <table>
        <thead><tr>
          <th>Usuario IG</th><th>Categoría</th><th>Seguidores</th><th>Vista mín.</th><th>% Masculino</th><th>Marca</th><th>Presupuesto aprobado</th>
        </tr></thead>
        <tbody>
          ${casosFiltrados.map(c=>`
            <tr>
              <td>${c.inf.usuario_ig}</td>
              <td>${c.inf.categoria||'—'}</td>
              <td class="mono">${c.inf.seguidores?Number(c.inf.seguidores).toLocaleString('es-AR'):'—'}</td>
              <td class="mono">${c.inf.vista_reel_min?Number(c.inf.vista_reel_min).toLocaleString('es-AR'):'—'}</td>
              <td class="mono">${c.inf.publico_masculino_pct||'—'}%</td>
              <td>${c.neg.marca}</td>
              <td class="mono gain">${money(c.neg.presupuesto_marca)}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
      </div>
    ` : '<p class="empty-state">No hay negociaciones aprobadas en ese rango de fechas.</p>'}
  `;
}

function renderDetail(){
  const inf = state.influencers.find(i=>i.id===state.detailId);
  if(!inf) return `<div class="empty-state">Influencer no encontrado.</div>`;
  const negs = inf.negociaciones||[];
  const pre = precalificacion(inf);
  const preClass = pre.estado==='Precalificado' ? 'gain' : pre.estado==='Descartado' ? 'pct-bad' : 'muted';

  return `
    <span class="back-link" id="back-to-pool">← Volver al pool</span>
    <div class="detail-header">
      ${inf.foto_url ? `<img src="${inf.foto_url}" style="width:56px; height:56px; border-radius:50%; object-fit:cover; border:1px solid var(--border);">` : ''}
      <div>
        <h2>${inf.favorito?'⭐ ':''}${inf.usuario_ig} ${inf.riesgo?`<span class="chip ${inf.riesgo==='Alto'?'pct-bad':inf.riesgo==='Bajo'?'gain':''}" style="font-size:11px;">Riesgo: ${inf.riesgo}</span>`:''}</h2>
        <div class="muted">${inf.categoria||'Sin categoría'} · Público masculino: <span class="${inf.publico_masculino_pct<60?'pct-bad':'pct-ok'}">${inf.publico_masculino_pct||'—'}%</span> · Seguidores: ${inf.seguidores?Number(inf.seguidores).toLocaleString('es-AR'):'—'} · Vista mín.: ${inf.vista_reel_min?Number(inf.vista_reel_min).toLocaleString('es-AR'):'—'}</div>
        ${(inf.redes&&inf.redes.length) ? `<div class="muted" style="margin-top:4px">Audiencia combinada (todas las cuentas): <span class="mono gain">${((Number(inf.seguidores)||0)+inf.redes.reduce((s,r)=>s+(Number(r.seguidores)||0),0)).toLocaleString('es-AR')}</span></div>` : ''}
        <div class="muted" style="margin-top:4px">Precalificación: <span class="${preClass}">${pre.estado}</span>${pre.motivo?` — ${pre.motivo}`:''}</div>
        <div class="muted" style="margin-top:4px">Código promo: <span class="mono">${inf.codigo_promocional||'—'}</span> · Logo: ${inf.logo_link?`<a href="${inf.logo_link}" target="_blank" style="color:var(--gold)">Ver logo</a>`:'—'}</div>
      </div>
      <div>
        ${inf.link_ig ? `<a href="${inf.link_ig}" target="_blank">Ver Instagram →</a>` : ''}
        <button class="ghost" id="btn-compartir" style="margin-left:10px">Compartir con Michael</button>
        <button class="ghost" id="btn-imprimir" style="margin-left:10px">Imprimir ficha</button>
        <button class="ghost" id="btn-desc-michael" style="margin-left:10px">Descripción para Michael</button>
        <button class="ghost" id="btn-edit-profile" style="margin-left:10px">Editar perfil</button>
        <button class="ghost" id="btn-delete-inf" style="margin-left:10px; color:var(--coral); border-color:var(--coral-dim)">Eliminar</button>
      </div>
    </div>

    <div class="detail-section">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
        <h3 style="margin:0">Otras cuentas / redes</h3>
        <button class="ghost" id="btn-new-red">+ Agregar cuenta</button>
      </div>
      ${(inf.redes&&inf.redes.length) ? inf.redes.map(r=>`
        <div class="contact-entry" style="align-items:center;">
          <span>
            <span class="chip" style="margin-right:8px;">${r.plataforma}</span>
            ${r.activa===false ? '<span class="chip pct-bad" style="margin-right:8px;">Inactiva</span>' : ''}
            ${r.usuario||'—'} ${r.seguidores?`· ${Number(r.seguidores).toLocaleString('es-AR')} seguidores`:''}
            ${r.link?` · <a href="${r.link}" target="_blank" style="color:var(--gold)">abrir</a>`:''}
            ${r.fecha_actualizacion && daysBetween(r.fecha_actualizacion, todayStr())>=90 ? ' · <span class="pct-bad" style="font-size:11px;">datos desactualizados</span>' : ''}
          </span>
          <span style="display:flex; gap:10px;">
            <span class="fecha" style="cursor:pointer" data-edit-red="${r.id}">Editar</span>
            <span class="fecha" style="cursor:pointer; color:var(--coral)" data-delete-red="${r.id}">Eliminar</span>
          </span>
        </div>
      `).join('') : '<p class="muted">Sin otras cuentas cargadas.</p>'}
    </div>

    <div class="detail-section">
      <h3>Contacto</h3>
      <div class="neg-grid">
        <div><span class="k">Contacto</span><span class="v">${inf.contacto||'—'}</span></div>
        <div><span class="k">Prioridad</span><span class="v">${inf.prioridad||'—'}</span></div>
        <div><span class="k">Cooldown hasta</span><span class="v">${inf.cooldown_hasta||'—'}</span></div>
      </div>
      ${(inf.etiquetas&&inf.etiquetas.length) ? `<div class="chips">${inf.etiquetas.map(t=>`<span class="chip">${t}</span>`).join('')}</div>` : ''}
      <div class="contact-log">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
          <span class="k" style="margin:0">Historial de contacto</span>
          <button class="ghost" id="btn-new-contacto" style="font-size:12px; padding:6px 10px;">+ Registrar contacto</button>
        </div>
        ${(inf.historial_contacto&&inf.historial_contacto.length) ? inf.historial_contacto.slice().reverse().map(c=>`
          <div class="contact-entry"><span>${c.nota||'Sin nota'}</span><span class="fecha">${c.fecha}</span></div>
        `).join('') : '<p class="muted">Todavía no registraste contactos.</p>'}
        ${sugerenciaReescribir(inf)}
      </div>
    </div>

    <div class="detail-section">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
        <h3 style="margin:0">Estadísticas de audiencia</h3>
        <button class="primary" id="btn-new-stats">+ Subir captura</button>
      </div>
      ${(inf.historial_estadisticas&&inf.historial_estadisticas.length) ? inf.historial_estadisticas.slice().sort((a,b)=>b.fecha.localeCompare(a.fecha)).map((s,i,arr)=>{
        const anterior = arr[i+1];
        let delta = '';
        if(anterior && s.pct_masculino!=null && anterior.pct_masculino!=null){
          const diff = s.pct_masculino - anterior.pct_masculino;
          delta = diff>0 ? `<span class="gain">↑ +${diff}pts vs captura anterior</span>` : diff<0 ? `<span class="pct-bad">↓ ${diff}pts vs captura anterior</span>` : `<span class="muted">sin cambios</span>`;
        }
        return `
        <div class="neg-item">
          <div class="neg-item-top"><strong>${s.fecha}</strong>${delta}</div>
          <div class="neg-grid">
            <div><span class="k">% Masculino</span><span class="v ${s.pct_masculino<60?'pct-bad':'pct-ok'}">${s.pct_masculino!=null?s.pct_masculino+'%':'—'}</span></div>
            <div><span class="k">% Femenino</span><span class="v">${s.pct_femenino!=null?s.pct_femenino+'%':'—'}</span></div>
            <div><span class="k">País principal</span><span class="v">${s.pais_principal||'—'}</span></div>
            <div><span class="k">Rango de edad</span><span class="v">${s.rango_edad_principal||'—'}</span></div>
          </div>
          ${s.captura_url ? `<a href="${s.captura_url}" target="_blank" style="color:var(--gold); font-size:12px; display:inline-block; margin-top:8px;">Ver captura original</a>` : '<span class="muted" style="font-size:11px; display:block; margin-top:8px;">Sin imagen guardada</span>'}
        </div>`;
      }).join('') : '<p class="muted">Todavía no subiste ninguna captura de estadísticas.</p>'}
    </div>

    <div class="detail-section">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
        <h3 style="margin:0">Historial de negociaciones</h3>
        <button class="primary" id="btn-new-neg">+ Nueva negociación</button>
      </div>
      ${negs.length ? negs.slice().reverse().map(neg=>{
        const ganancia = (Number(neg.presupuesto_marca)||0) - (Number(neg.pago_final)||0);
        const presupuesto = Number(neg.presupuesto_marca)||0;
        const pagoPct = presupuesto ? Math.min(100,(Number(neg.pago_final)||0)/presupuesto*100) : 0;
        const reels = (neg.reels||[]).slice().sort((a,b)=>(a.numero||0)-(b.numero||0));
        const numReels = neg.num_reels||5;
        const pagadoTotal = reels.reduce((s,r)=>s+(Number(r.monto_pagado)||0),0);
        const cuentaUsada = (!neg.cuenta_id || neg.cuenta_id==='principal') ? `${inf.usuario_ig} (Instagram)` : (()=>{ const rc=(inf.redes||[]).find(x=>x.id===neg.cuenta_id); return rc ? `${rc.usuario||rc.link} (${rc.plataforma})` : `${inf.usuario_ig} (Instagram)`; })();
        return `
        <div class="neg-item">
          <div class="neg-item-top">
            <strong>${neg.marca}</strong>
            <span class="badge ${neg.estado.replace(' ','')}">${neg.estado}</span>
          </div>
          <div class="muted" style="font-size:12px; margin-bottom:8px;">Cuenta: ${cuentaUsada} ${neg.link_contrato?`· <a href="${neg.link_contrato}" target="_blank" style="color:var(--gold)">Ver contrato</a>`:''}</div>
          ${(neg.estado_historial&&neg.estado_historial.length) ? `<div class="muted" style="font-size:11px; margin-bottom:8px;">Historial: ${neg.estado_historial.map(h=>`${h.estado} (${h.fecha})`).join(' → ')}</div>` : ''}
          <div class="neg-grid">
            <div><span class="k">Fecha</span><span class="v">${neg.fecha||'—'}</span></div>
            <div><span class="k">Presupuesto marca</span><span class="v">${money(neg.presupuesto_marca)}</span></div>
            <div><span class="k">Oferta inicial</span><span class="v">${money(neg.oferta_inicial)}</span></div>
            <div><span class="k">Pago final</span><span class="v">${money(neg.pago_final)}</span></div>
            <div><span class="k">Ganancia</span><span class="v gain">${money(ganancia)}</span></div>
            <div><span class="k">Medio de pago</span><span class="v">${neg.medio_pago||'—'}</span></div>
            <div><span class="k">ID de pago</span><span class="v">${neg.id_pago||'—'}</span></div>
            <div><span class="k">Estado de pago</span><span class="v">${neg.estado_pago||'—'}</span></div>
            <div><span class="k">Modalidad de pago</span><span class="v">${neg.modalidad_pago||'—'}</span></div>
          </div>
          ${presupuesto ? `<div class="spread-bar"><div style="width:${pagoPct}%; background:var(--gold)"></div><div style="width:${100-pagoPct}%; background:var(--teal)"></div></div>` : ''}
          ${neg.motivo_rechazo ? `<p class="muted" style="margin-top:10px">Motivo: ${neg.motivo_rechazo}</p>` : ''}

          <div class="contact-log">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
              <span class="k" style="margin:0">Reels (${reels.length}/${numReels}) · pagado ${money(pagadoTotal)} de ${money(neg.pago_final)}</span>
              <button class="ghost" style="font-size:12px; padding:6px 10px;" data-new-reel="${neg.id}">+ Reel</button>
            </div>
            ${reels.length ? reels.map(r=>`
              <div class="contact-entry">
                <span>Reel ${r.numero} <span class="chip" style="font-size:10px; padding:1px 7px;">${r.plataforma||'Instagram'}</span> · ${r.fecha_publicacion||'sin fecha'} ${r.link_reel?`· <a href="${r.link_reel}" target="_blank" style="color:var(--gold)">reel</a>`:''} ${r.link_video_descargado?`· <a href="${r.link_video_descargado}" target="_blank" style="color:var(--gold)">video guardado</a>`:'· <span class="pct-bad">falta descargar</span>'} ${r.monto_pagado?`· ${money(r.monto_pagado)} pagado`:''} ${r.comprimido?'· <span class="gain">comprimido</span>':''}</span>
                <span class="fecha" style="cursor:pointer" data-edit-reel="${neg.id}|${r.id}">Editar</span>
              </div>
            `).join('') : '<p class="muted">Todavía no se subió ningún reel de esta campaña.</p>'}
          </div>

          <div class="contact-log">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
              <span class="k" style="margin:0">Pagos de Michael (tramos) · recibido ${money((neg.tramos||[]).filter(t=>t.estado==='Recibido').reduce((s,t)=>s+(Number(t.monto)||0),0))} de ${money(neg.presupuesto_marca)}</span>
              <button class="ghost" style="font-size:12px; padding:6px 10px;" data-new-tramo="${neg.id}">+ Tramo</button>
            </div>
            ${(neg.tramos&&neg.tramos.length) ? neg.tramos.map(t=>`
              <div class="contact-entry">
                <span>${money(t.monto)} · <span class="badge ${t.estado}">${t.estado}</span> ${t.fecha_recibido?`· recibido ${t.fecha_recibido}`:''}</span>
                <span class="fecha" style="cursor:pointer" data-edit-tramo="${neg.id}|${t.id}">Editar</span>
              </div>
            `).join('') : '<p class="muted">Sin tramos cargados — si Michael paga todo junto, cargá uno solo por el total.</p>'}
          </div>

          <div style="display:flex; gap:8px; margin-top:10px;">
            <button class="ghost" data-edit-neg="${neg.id}">Editar</button>
            <button class="ghost" data-msg-ia="${neg.id}">Mensaje con IA</button>
            <button class="ghost" data-duplicar-neg="${neg.id}">Duplicar</button>
            <button class="ghost" style="color:var(--coral); border-color:var(--coral-dim)" data-delete-neg="${neg.id}">Eliminar</button>
          </div>
        </div>`;
      }).join('') : '<p class="muted">Todavía no hay negociaciones registradas.</p>'}
    </div>
  `;
}

// ---------- Modales ----------
function abrirComparadorModal(){
  const seleccionados = state.influencers.filter(i=>state.poolSeleccionados.has(i.id));
  const overlay = document.createElement('div');
  overlay.className='overlay';
  const filas = [
    {label:'Categoría', get:i=>i.categoria||'—'},
    {label:'País', get:i=>i.pais||'—'},
    {label:'Seguidores', get:i=>i.seguidores?Number(i.seguidores).toLocaleString('es-AR'):'—'},

function abrirGenerarListaModal(){

  overlay.innerHTML = `

      <p class="muted" style="margin-bottom:14px">${seleccionados.length} perfil${seleccionados.length>1?'es':''} seleccionado${seleccionados.length>1?'s':''}. Esto crea una negociación en Standby para cada uno (si todavía no la tenía con esta marca) y te arma el texto con los links, listo para mandar.</p>
      <div class="field"><label>Marca</label><input id="gl-marca" placeholder="1xBet, Betano..."></div>

        <button class="primary" id="gl-generar">Generar</button>
      </div>
      <div class="field" style="margin-top:14px;"><label>Texto para copiar / compartir</label><textarea id="gl-texto" rows="8" readonly></textarea></div>
      <div class="modal-actions">
        <button class="primary" id="gl-compartir">Compartir / Copiar</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  document.getElementById('modal-close').onclick = ()=>overlay.remove();
  document.getElementById('modal-cancel').onclick = ()=>overlay.remove();
  document.getElementById('gl-generar').onclick = async ()=>{
    const marca = document.getElementById('gl-marca').value.trim();
    if(!marca){ alert('Falta el nombre de la marca'); return; }
    seleccionados.forEach(inf=>{
      const yaExiste = (inf.negociaciones||[]).some(n=>n.marca.toLowerCase()===marca.toLowerCase());
      if(!yaExiste){
        inf.negociaciones = inf.negociaciones || [];
        inf.negociaciones.push({
          id:uid(), marca, fecha:todayStr(), presupuesto_marca:'', oferta_inicial:'', pago_final:'',
          estado:'Standby', motivo_rechazo:'', medio_pago:'', id_pago:'', estado_pago:'Pendiente',
          num_reels:5, modalidad_pago:'50/50', reels:[], tramos:[]
        });
      }
    });
    await saveData();
    state.poolSeleccionados.clear();
    const texto = `Perfiles para ${marca}:\n\n` + seleccionados.map(inf=>`👤 ${inf.usuario_ig}${inf.seguidores?` (${Number(inf.seguidores).toLocaleString('es-AR')} seguidores)`:''}\n${inf.link_ig||'sin link cargado'}`).join('\n\n');
    document.getElementById('gl-texto').value = texto;
  };
  document.getElementById('gl-compartir').onclick = async ()=>{
    const texto = document.getElementById('gl-texto').value;
    if(!texto){ alert('Generá el texto primero'); return; }
    if(navigator.share){
      try{ await navigator.share({text:texto}); }catch(e){}
    }else{
      navigator.clipboard.writeText(texto);
      alert('Copiado al portapapeles.');
    }
  };
}

      const supa = getSupabaseClient();
      if(supa){
        const status = document.getElementById('m-foto-status');
        status.innerHTML = `<span class="spinner"></span>Subiendo foto...`;
        try{
          const path = `avatares/${inf.id}_${Date.now()}_${fotoArchivo.name}`;
          const { error } = await supa.storage.from('capturas').upload(path, fotoArchivo);
          if(error) throw error;
          const { data: urlData } = supa.storage.from('capturas').getPublicUrl(path);
          inf.foto_url = urlData.publicUrl;
          status.textContent = '';
        }catch(err){
          console.error('Error subiendo foto', err);
          status.innerHTML = `<span class="pct-bad">No se pudo subir la foto.</span>`;
        }
      }
    }
    if(statsPendiente){
      const supa = getSupabaseClient();
      if(supa && statsArchivo){
        try{
          const path = `${inf.id}/${Date.now()}_${statsArchivo.name}`;
          const { error } = await supa.storage.from('capturas').upload(path, statsArchivo);
          if(!error){
            const { data: urlData } = supa.storage.from('capturas').getPublicUrl(path);
            statsPendiente.captura_url = urlData.publicUrl;
          }
        }catch(err){ console.error('Error subiendo captura de estadísticas', err); }
      }
      inf.historial_estadisticas = inf.historial_estadisticas || [];
      inf.historial_estadisticas.push(statsPendiente);
      if(statsPendiente.pct_masculino!=null) inf.publico_masculino_pct = statsPendiente.pct_masculino;
    }
    const usuarioNorm = inf.usuario_ig.toLowerCase().replace('@','').trim();
    const linkNorm = document.getElementById('m-link').value.trim().toLowerCase().replace(/\/$/,'');
    const duplicado = state.influencers.find(otro=>{
      if(otro.id===inf.id) return false;
      const otroUsuario = (otro.usuario_ig||'').toLowerCase().replace('@','').trim();
      const otroLink = (otro.link_ig||'').toLowerCase().replace(/\/$/,'');
      return otroUsuario===usuarioNorm || (linkNorm && otroLink===linkNorm);
    });
    if(duplicado && !confirm(`Ya tenés cargado a "${duplicado.usuario_ig}" con estos mismos datos. ¿Guardar igual como un perfil nuevo?`)) return;
    inf.link_ig = document.getElementById('m-link').value.trim();
    inf.contacto = document.getElementById('m-contacto').value.trim();
    inf.pais = document.getElementById('m-pais').value;
    inf.fuente_captacion = document.getElementById('m-fuente').value;
    inf.riesgo = document.getElementById('m-riesgo').value;
    inf.favorito = document.getElementById('m-favorito').checked;
    inf.categoria = document.getElementById('m-categoria').value;
    inf.publico_masculino_pct = document.getElementById('m-pct').value;
    inf.seguidores = document.getElementById('m-seguidores').value;
    inf.vista_reel_min = document.getElementById('m-vistamin').value;
    inf.prioridad = document.getElementById('m-prioridad').value;
    inf.cooldown_hasta = document.getElementById('m-cooldown').value;
    inf.etiquetas = document.getElementById('m-etiquetas').value.split(',').map(s=>s.trim()).filter(Boolean);
    inf.codigo_promocional = document.getElementById('m-promo').value.trim().toUpperCase().replace(/\s+/g,'');
    inf.logo_link = document.getElementById('m-logo').value.trim();
    inf.historial_contacto = inf.historial_contacto || [];
    if(!existing) state.influencers.push(inf);
    await saveData();
    overlay.remove();
    render();
  };
}

function buildShareText(inf){
  const stats = (inf.historial_estadisticas||[]).slice().sort((a,b)=>b.fecha.localeCompare(a.fecha))[0];
  let txt = `${inf.usuario_ig}\n`;
  if(inf.link_ig) txt += `Instagram: ${inf.link_ig}\n`;
  if(inf.categoria) txt += `Categoría: ${inf.categoria}\n`;
  if(inf.seguidores) txt += `Seguidores: ${Number(inf.seguidores).toLocaleString('es-AR')}\n`;
  if(inf.vista_reel_min) txt += `Vista mínima de reel: ${Number(inf.vista_reel_min).toLocaleString('es-AR')}\n`;
  if(inf.publico_masculino_pct) txt += `Audiencia masculina: ${inf.publico_masculino_pct}%\n`;
  if(stats){
    if(stats.pais_principal) txt += `País principal: ${stats.pais_principal}\n`;
    if(stats.rango_edad_principal) txt += `Rango de edad: ${stats.rango_edad_principal}\n`;
    if(stats.captura_url){
      txt += `Captura original de las estadísticas: ${stats.captura_url}\n`;
    }else{
      txt += `(sin captura de estadísticas guardada todavía)\n`;
    }
  }else{
    txt += `(sin estadísticas cargadas todavía)\n`;
  }
  return txt;
}

async function compartirConMichael(infId){
  const inf = state.influencers.find(i=>i.id===infId);
  const texto = buildShareText(inf);
  if(navigator.share){
    try{ await navigator.share({ text: texto }); }catch(e){ /* el usuario canceló, no hacer nada */ }
  }else{
    try{
      await navigator.clipboard.writeText(texto);
      alert('Copiado al portapapeles — pegalo donde le hablás a Michael.');
    }catch(e){
      alert('No se pudo copiar automáticamente. Copiá este texto a mano:\n\n' + texto);
    }
  }
}

function sugerirOferta(inf){
  const seg = Number(inf.seguidores);
  if(!seg) return null;
  const rango = 0.4;
  const ofertas = [];
  state.influencers.forEach(otro=>{
    if(otro.id===inf.id) return;
    const otroSeg = Number(otro.seguidores);
    if(!otroSeg) return;
    if(otroSeg < seg*(1-rango) || otroSeg > seg*(1+rango)) return;
    (otro.negociaciones||[]).forEach(neg=>{
      if(neg.oferta_inicial) ofertas.push(Number(neg.oferta_inicial));
    });
  });
  if(!ofertas.length) return null;
  const promedio = ofertas.reduce((a,b)=>a+b,0) / ofertas.length;
  return { promedio: Math.round(promedio), casos: ofertas.length };
}

      pct_femenino: document.getElementById('s-fem').value!=='' ? Number(document.getElementById('s-fem').value) : null,

      rango_edad_principal: document.getElementById('s-edad').value.trim(),
      captura_url: null
    };
    const supa = getSupabaseClient();
    if(supa && archivoOriginal){
      btnGuardar.disabled = true;
      status.innerHTML = `<span class="spinner"></span>Subiendo la captura...`;
      try{
        const path = `${inf.id}/${Date.now()}_${archivoOriginal.name}`;
        const { error } = await supa.storage.from('capturas').upload(path, archivoOriginal);
        if(error) throw error;
        const { data: urlData } = supa.storage.from('capturas').getPublicUrl(path);
        entry.captura_url = urlData.publicUrl;
      }catch(err){
        console.error('Error subiendo captura', err);
        status.innerHTML = `<span class="pct-bad">No se pudo subir la captura (¿existe el bucket "capturas"?). Se guardan los datos igual, sin la imagen.</span>`;
      }

    inf.historial_estadisticas.push(entry);
    if(entry.pct_masculino!=null) inf.publico_masculino_pct = entry.pct_masculino;
    if(!inf.pais && entry.pais_principal){
      const matchPais = PAISES.find(p=>entry.pais_principal.toLowerCase().includes(p.toLowerCase()));
      if(matchPais) inf.pais = matchPais;
    }
    await saveData();
    overlay.remove();
    render();
  };
}

function exportCSV(lista){
  const influencersAExportar = lista || state.influencers;
  const rows = [["Usuario IG","Categoría","% Masculino","Prioridad","Plataformas extra","Marca","Estado","Presupuesto","Pago final","Ganancia","Estado pago"]];
  influencersAExportar.forEach(inf=>{
    const plataformasExtra = (inf.redes||[]).map(r=>r.plataforma).join(', ');
    (inf.negociaciones&&inf.negociaciones.length? inf.negociaciones : [{}]).forEach(neg=>{
      const ganancia = (Number(neg.presupuesto_marca)||0)-(Number(neg.pago_final)||0);
      rows.push([inf.usuario_ig, inf.categoria||'', inf.publico_masculino_pct||'', inf.prioridad||'', plataformasExtra, neg.marca||'', neg.estado||'', neg.presupuesto_marca||'', neg.pago_final||'', neg.estado?ganancia:'', neg.estado_pago||'']);
    });
  });
  const csv = rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'influencers.csv'; a.click();
  URL.revokeObjectURL(url);
}
