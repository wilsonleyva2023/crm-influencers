  document.getElementById('btn-cambiar-pass').onclick = openCambiarPasswordModal;
  document.getElementById('btn-config-nube').onclick = openConfigNubeModal;
  document.getElementById('btn-config-ia').onclick = openConfigIAModal;
  document.getElementById('btn-backup').onclick = downloadBackup;
  document.getElementById('btn-restore-trigger').onclick = ()=>document.getElementById('btn-restore').click();
  document.getElementById('btn-restore').onchange = (e)=>{
    if(e.target.files[0]) restoreBackup(e.target.files[0]);
    e.target.value = '';
  };

  if(state.view==='portfolio'){
    const casos = [];
    state.influencers.forEach(inf=>{
      (inf.negociaciones||[]).forEach(neg=>{
        const reelsConVideo = (neg.reels||[]).filter(r=>r.link_video_descargado);
        if(reelsConVideo.length){
          const ganancia = (Number(neg.presupuesto_marca)||0)-(Number(neg.pago_final)||0);
          casos.push({inf, neg, reelsConVideo, ganancia});
        }
      });
    });
    document.querySelectorAll('[data-caso-exito]').forEach(btn=>{
      btn.onclick = async ()=>{
        const i = btn.dataset.casoExito;
        const c = casos[i];
        const status = document.getElementById(`caso-status-${i}`);
        const textarea = document.getElementById(`caso-texto-${i}`);
        btn.disabled = true;
        status.innerHTML = `<span class="spinner"></span>Escribiendo...`;
        const contexto = `Influencer: ${c.inf.usuario_ig} (${c.inf.categoria||'sin categoría'}, ${c.inf.seguidores?Number(c.inf.seguidores).toLocaleString('es-AR')+' seguidores':'seguidores sin dato'}). Marca: ${c.neg.marca}. Reels publicados: ${c.reelsConVideo.length} de ${c.neg.num_reels||5}. Ganancia generada: ${money(c.ganancia)}.`;
        const prompt = `Escribí un caso de éxito corto (máximo 4 líneas) para mostrarle a otra agencia o marca, sobre esta campaña de influencer marketing ya realizada. Español profesional, sin exagerar, basado solo en estos datos reales: ${contexto}`;
        try{
          const texto = await llamarGemini(prompt);
          textarea.value = texto.trim();
          textarea.style.display = 'block';
          status.textContent = 'Listo — lo podés copiar del cuadro.';
        }catch(err){
          status.innerHTML = err.message==='SIN_CLAVE' ? 'Configurá la IA primero.' : `<span class="pct-bad">Error: ${err.message}</span>`;
        }
        btn.disabled = false;
      };
    });
  }

  if(state.view==='mensajes'){
    document.querySelectorAll('[data-copy-msg]').forEach(btn=>{
      btn.onclick = ()=>{
        const p = state.plantillas.find(pl=>pl.id===btn.dataset.copyMsg);
        if(!p) return;
        navigator.clipboard.writeText(p.texto).then(()=>{
          btn.textContent = 'Copiado ✓';
          setTimeout(()=>btn.textContent='Copiar', 1500);
        }).catch(()=>alert('No se pudo copiar. Copialo manualmente.'));
      };
    });
    document.querySelectorAll('[data-edit-msg]').forEach(btn=>{
      btn.onclick = ()=>{
        const p = state.plantillas.find(pl=>pl.id===btn.dataset.editMsg);
        if(p) openPlantillaModal(p);
      };
    });
    document.querySelectorAll('[data-delete-msg]').forEach(btn=>{
      btn.onclick = async ()=>{
        if(!confirm('¿Eliminar esta plantilla?')) return;
        state.plantillas = state.plantillas.filter(pl=>pl.id!==btn.dataset.deleteMsg);
        await savePlantillas();
        render();
      };
    });
    document.getElementById('btn-nueva-plantilla').onclick = ()=>openPlantillaModal();
  }

  if(state.view==='herramientas'){
    document.querySelectorAll('[data-copy-palabra]').forEach(chip=>{
      chip.onclick = ()=>{
        navigator.clipboard.writeText(chip.dataset.copyPalabra).then(()=>{
          const original = chip.textContent;
          chip.textContent = 'Copiado ✓';
          setTimeout(()=>chip.textContent = original, 1200);
        });
      };
    });
    ['cot-desde','cot-hasta'].forEach(id=>{
      document.getElementById(id)?.addEventListener('change', ()=>{ document.getElementById('main').innerHTML = renderHerramientas(); attachEvents(); });
    });
    const calcular = ()=>{
      const presupuesto = Number(document.getElementById('calc-presupuesto').value)||0;
      const pago = Number(document.getElementById('calc-pago').value)||0;
      document.getElementById('calc-resultado').innerHTML = `Ganancia: <span class="gain">${money(presupuesto-pago)}</span>`;
    };
    document.getElementById('calc-presupuesto')?.addEventListener('input', calcular);
    document.getElementById('calc-pago')?.addEventListener('input', calcular);
    document.getElementById('btn-guardar-notas')?.addEventListener('click', async ()=>{
      state.notasGenerales = document.getElementById('notas-generales').value;
      const status = document.getElementById('notas-status');
      status.textContent = 'Guardando...';
      await saveNotasGenerales();
      status.innerHTML = '<span class="gain">Guardado ✓</span>';
    });
  }

  if(state.view==='asistente'){
    const enviar = async ()=>{
      const input = document.getElementById('chat-a-input');
      const texto = input.value.trim();
      if(!texto) return;
      state.chatHistorial = state.chatHistorial || [];
      state.chatHistorial.push({role:'user', texto});
      await saveChatHistory(state.chatHistorial);
      render();
      const status = document.getElementById('chat-a-status');
      status.innerHTML = `<span class="spinner"></span>Pensando...`;
      try{
        const respuesta = await llamarGeminiChat(state.chatHistorial);
        state.chatHistorial.push({role:'model', texto: respuesta.trim()});
        await saveChatHistory(state.chatHistorial);
        status.textContent = '';
      }catch(err){
        if(err.message==='SIN_CLAVE'){
          status.innerHTML = 'Todavía no configuraste la IA. <span style="color:var(--gold); cursor:pointer; text-decoration:underline" id="chat-ir-config">Configurarla ahora</span>';
          document.getElementById('chat-ir-config')?.addEventListener('click', openConfigIAModal);
        }else{
          status.innerHTML = `<span class="pct-bad">Error: ${err.message}</span>`;
        }
      }
      render();
    };
    document.getElementById('chat-a-send').onclick = enviar;
    document.getElementById('chat-a-input').addEventListener('keydown', (e)=>{
      if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); enviar(); }
    });
    document.getElementById('chat-a-borrar').onclick = async ()=>{
      if(!confirm('¿Borrar toda la conversación con el asistente?')) return;
      state.chatHistorial = [];
      await saveChatHistory([]);
      render();
    };
  }

  if(state.view==='dashboard'){
    document.getElementById('btn-new-from-dash')?.addEventListener('click', ()=>openInfluencerModal());
    document.getElementById('btn-carga-rapida')?.addEventListener('click', ()=>openCargaRapidaModal());
    document.querySelectorAll('[data-goto]').forEach(el=>{
      el.onclick = ()=>{ state.detailId = el.dataset.goto; state.view='detail'; render(); };
    });
    document.getElementById('btn-resumen-semanal').onclick = async ()=>{
      const box = document.getElementById('resumen-semanal-box');
      box.innerHTML = `<span class="spinner"></span>Armando el resumen...`;
      const d = datosSemana();
      const prompt = `Escribí un resumen semanal corto (máximo 4 líneas) para un Influencer Marketing Manager, en español rioplatense, con estos datos reales de los últimos 7 días — no inventes ni cambies estos números: ganancia estimada $${d.ganancia}, ${d.reelsSubidos} reels subidos, ${d.nuevasNegociaciones} negociaciones nuevas iniciadas, ${d.alertasPendientes} alertas pendientes de resolver. Sé directo, tipo mensaje de WhatsApp a uno mismo.`;
      try{
        const texto = await llamarGemini(prompt);
        box.textContent = texto.trim();
      }catch(err){
        if(err.message==='SIN_CLAVE'){
          box.innerHTML = 'Configurá la IA primero.';
        }else{
          box.innerHTML = `<span class="pct-bad">Error: ${err.message}</span>`;
        }
      }
    };
  }

  if(state.view==='pool'){
    document.getElementById('table-wrap').innerHTML = renderTable();
    document.getElementById('btn-new').onclick = ()=>openInfluencerModal();
    document.getElementById('btn-export').onclick = ()=>exportCSV(state.ultimoFiltroPool);
    ['f-cat','f-estado','f-preca','f-plataforma','f-search'].forEach(id=>{
      document.getElementById(id).addEventListener('input', ()=>{
        document.getElementById('table-wrap').innerHTML = renderTable();
        attachTableEvents();
      });
    });
    attachTableEvents();
  }

  if(state.view==='detail'){
    document.getElementById('back-to-pool').onclick = ()=>{ state.view='pool'; render(); };
    document.getElementById('btn-compartir').onclick = ()=>compartirConMichael(state.detailId);
    document.getElementById('btn-imprimir').onclick = ()=>window.print();
    document.getElementById('btn-desc-michael').onclick = ()=>openDescMichaelModal(state.detailId);
    document.getElementById('btn-edit-profile').onclick = ()=>{
      const inf = state.influencers.find(i=>i.id===state.detailId);
      openInfluencerModal(inf);
    };
    document.getElementById('btn-delete-inf').onclick = async ()=>{
      if(confirm('¿Eliminar este influencer? Esta acción no se puede deshacer.')){
        state.influencers = state.influencers.filter(i=>i.id!==state.detailId);
        await saveData();
        state.view='pool'; render();
      }
    };
    document.getElementById('btn-new-neg').onclick = ()=>openNegModal(state.detailId);
    document.getElementById('btn-new-contacto').onclick = ()=>openContactoModal(state.detailId);
    document.getElementById('btn-new-red').onclick = ()=>openRedModal(state.detailId);
    document.querySelectorAll('[data-edit-red]').forEach(el=>{
      el.onclick = ()=>{
        const inf = state.influencers.find(i=>i.id===state.detailId);
        const red = inf.redes.find(r=>r.id===el.dataset.editRed);
        if(red) openRedModal(state.detailId, red);
      };
    });
    document.querySelectorAll('[data-delete-red]').forEach(el=>{
      el.onclick = async ()=>{
        if(!confirm('¿Eliminar esta cuenta?')) return;
        const inf = state.influencers.find(i=>i.id===state.detailId);
        inf.redes = inf.redes.filter(r=>r.id!==el.dataset.deleteRed);
        await saveData();
        render();
      };
    });
    document.getElementById('btn-new-stats').onclick = ()=>openStatsModal(state.detailId);
    document.querySelectorAll('[data-new-reel]').forEach(btn=>{
      btn.onclick = ()=>openReelModal(state.detailId, btn.dataset.newReel);
    });
    document.querySelectorAll('[data-new-tramo]').forEach(btn=>{
      btn.onclick = ()=>openTramoModal(state.detailId, btn.dataset.newTramo);
    });
    document.querySelectorAll('[data-edit-tramo]').forEach(el=>{
      el.onclick = ()=>{
        const [negId, tramoId] = el.dataset.editTramo.split('|');
        const inf = state.influencers.find(i=>i.id===state.detailId);
        const neg = inf.negociaciones.find(n=>n.id===negId);
        const tramo = neg.tramos.find(t=>t.id===tramoId);
        openTramoModal(state.detailId, negId, tramo);
      };
    });
    document.querySelectorAll('[data-edit-reel]').forEach(el=>{
      el.onclick = ()=>{
        const [negId, reelId] = el.dataset.editReel.split('|');
        const inf = state.influencers.find(i=>i.id===state.detailId);
        const neg = inf.negociaciones.find(n=>n.id===negId);
        const reel = neg.reels.find(r=>r.id===reelId);
        openReelModal(state.detailId, negId, reel);
      };
    });
    document.querySelectorAll('[data-edit-neg]').forEach(btn=>{
      btn.onclick = ()=>{
        const inf = state.influencers.find(i=>i.id===state.detailId);
        const neg = inf.negociaciones.find(n=>n.id===btn.dataset.editNeg);
        openNegModal(state.detailId, neg);
      };
    });
    document.querySelectorAll('[data-msg-ia]').forEach(btn=>{
      btn.onclick = ()=>openMensajeIAModal(state.detailId, btn.dataset.msgIa);
    });
    document.querySelectorAll('[data-duplicar-neg]').forEach(btn=>{
      btn.onclick = async ()=>{
        const inf = state.influencers.find(i=>i.id===state.detailId);
        const original = inf.negociaciones.find(n=>n.id===btn.dataset.duplicarNeg);
        if(!original) return;
        const copia = {
          id:uid(), marca: original.marca, fecha: todayStr(), presupuesto_marca:'', oferta_inicial:'', pago_final:'',
          estado:'Standby', motivo_rechazo:'', medio_pago: original.medio_pago, id_pago:'', estado_pago:'Pendiente',
          num_reels: original.num_reels, modalidad_pago: original.modalidad_pago, reels:[], tramos:[], estado_historial:[], link_contrato:''
        };
        inf.negociaciones.push(copia);
        await saveData();
        render();
        alert('Se creó una negociación nueva en Standby, con los mismos datos de base (marca, cantidad de reels, modalidad de pago). Completá los montos.');
      };
    });
    document.querySelectorAll('[data-delete-neg]').forEach(btn=>{
      btn.onclick = async ()=>{
        if(!confirm('¿Eliminar esta negociación?')) return;
        const inf = state.influencers.find(i=>i.id===state.detailId);
        inf.negociaciones = inf.negociaciones.filter(n=>n.id!==btn.dataset.deleteNeg);
        await saveData();
        render();
      };
    });
  }
}

function attachTableEvents(){
  document.querySelectorAll('[data-open]').forEach(row=>{
    row.onclick = ()=>{ state.detailId = row.dataset.open; state.view='detail'; render(); };
  });
  state.poolSeleccionados = state.poolSeleccionados || new Set();
  document.querySelectorAll('[data-seleccionar]').forEach(cb=>{
    cb.onchange = ()=>{
      const id = cb.dataset.seleccionar;
      if(cb.checked) state.poolSeleccionados.add(id); else state.poolSeleccionados.delete(id);
      document.getElementById('table-wrap').innerHTML = renderTable();
      attachTableEvents();
    };
  });
  document.getElementById('btn-limpiar-seleccion')?.addEventListener('click', ()=>{
    state.poolSeleccionados.clear();
    document.getElementById('table-wrap').innerHTML = renderTable();
    attachTableEvents();
  });
  document.getElementById('btn-generar-lista')?.addEventListener('click', ()=>abrirGenerarListaModal());
  document.getElementById('btn-comparar')?.addEventListener('click', ()=>abrirComparadorModal());
}

function renderLogin(mensaje){
  document.getElementById('main').innerHTML = `
    <div style="max-width:360px; margin:80px auto; text-align:center;">
      <h2 style="margin-bottom:20px;">Iniciar sesión</h2>
      ${mensaje ? `<p class="pct-bad" style="margin-bottom:14px">${mensaje}</p>` : ''}
      <div class="field" style="text-align:left"><label>Email</label><input id="login-email" type="email"></div>
      <div class="field" style="text-align:left"><label>Contraseña</label><input id="login-pass" type="password"></div>
      <button class="primary" id="login-btn" style="width:100%; margin-top:10px;">Entrar</button>
      <p style="margin-top:14px;"><span style="color:var(--gold); cursor:pointer; text-decoration:underline; font-size:13px;" id="link-olvide">¿Olvidaste tu contraseña?</span></p>
      <div id="login-status" class="ia-note" style="margin-top:12px"></div>
    </div>
  `;
  document.querySelector('nav').style.display = 'none';
  document.querySelector('.header-actions').style.display = 'none';
  const intentar = async ()=>{
    const email = document.getElementById('login-email').value.trim();
    const pass = document.getElementById('login-pass').value;
    const status = document.getElementById('login-status');
    status.innerHTML = `<span class="spinner"></span>Entrando...`;
    const supa = getSupabaseClient();
    const { error } = await supa.auth.signInWithPassword({ email, password: pass });
    if(error){
      status.innerHTML = `<span class="pct-bad">${error.message}</span>`;
      return;
    }
    document.querySelector('nav').style.display = '';
    document.querySelector('.header-actions').style.display = '';
    await loadData();
  };
  document.getElementById('login-btn').onclick = intentar;
  document.getElementById('login-pass').addEventListener('keydown', e=>{ if(e.key==='Enter') intentar(); });
  document.getElementById('link-olvide').onclick = ()=>renderOlvideContrasena();
}

function renderOlvideContrasena(){
  document.getElementById('main').innerHTML = `
    <div style="max-width:360px; margin:80px auto; text-align:center;">
      <h2 style="margin-bottom:20px;">Recuperar contraseña</h2>
      <p class="muted" style="margin-bottom:14px">Te mandamos un link a tu correo para que pongas una nueva.</p>
      <div class="field" style="text-align:left"><label>Email</label><input id="olvide-email" type="email"></div>
      <button class="primary" id="olvide-btn" style="width:100%; margin-top:10px;">Enviar link</button>
      <p style="margin-top:14px;"><span style="color:var(--gold); cursor:pointer; text-decoration:underline; font-size:13px;" id="link-volver">Volver a iniciar sesión</span></p>
      <div id="olvide-status" class="ia-note" style="margin-top:12px"></div>
    </div>
  `;
  document.getElementById('link-volver').onclick = ()=>renderLogin();
  document.getElementById('olvide-btn').onclick = async ()=>{
    const email = document.getElementById('olvide-email').value.trim();
    const status = document.getElementById('olvide-status');
    if(!email){ status.innerHTML = '<span class="pct-bad">Falta el email</span>'; return; }
    status.innerHTML = `<span class="spinner"></span>Enviando...`;
    const supa = getSupabaseClient();
    const { error } = await supa.auth.resetPasswordForEmail(email, { redirectTo: window.location.href.split('#')[0] });
    if(error){
      status.innerHTML = `<span class="pct-bad">${error.message}</span>`;
    }else{
      status.innerHTML = '<span class="gain">Listo — revisá tu correo (y la carpeta de spam) y tocá el link que te mandamos.</span>';
    }
  };
}

function renderNuevaContrasena(){
  document.getElementById('main').innerHTML = `
    <div style="max-width:360px; margin:80px auto; text-align:center;">
      <h2 style="margin-bottom:20px;">Poné tu nueva contraseña</h2>
      <div class="field" style="text-align:left"><label>Nueva contraseña</label><input id="nueva-pass" type="password"></div>
      <div class="field" style="text-align:left"><label>Repetila</label><input id="nueva-pass2" type="password"></div>
      <button class="primary" id="nueva-btn" style="width:100%; margin-top:10px;">Guardar</button>
      <div id="nueva-status" class="ia-note" style="margin-top:12px"></div>
    </div>
  `;
  document.querySelector('nav').style.display = 'none';
  document.querySelector('.header-actions').style.display = 'none';
  document.getElementById('nueva-btn').onclick = async ()=>{
    const p1 = document.getElementById('nueva-pass').value;
    const p2 = document.getElementById('nueva-pass2').value;
    const status = document.getElementById('nueva-status');
    if(!p1 || p1.length<6){ status.innerHTML = '<span class="pct-bad">Mínimo 6 caracteres</span>'; return; }
    if(p1!==p2){ status.innerHTML = '<span class="pct-bad">No coinciden</span>'; return; }
    status.innerHTML = `<span class="spinner"></span>Guardando...`;
    const supa = getSupabaseClient();
    const { error } = await supa.auth.updateUser({ password: p1 });
    if(error){
      status.innerHTML = `<span class="pct-bad">${error.message}</span>`;
    }else{
      status.innerHTML = '<span class="gain">Contraseña actualizada ✓ — entrando...</span>';
      document.querySelector('nav').style.display = '';
      document.querySelector('.header-actions').style.display = '';
      setTimeout(()=>loadData(), 1200);
    }
  };
}

async function cerrarSesion(){
  const supa = getSupabaseClient();
  if(supa) await supa.auth.signOut();
  location.reload();
}

async function iniciarApp(){
  const supa = getSupabaseClient();
  if(!supa){
    await loadData();
    return;
  }
  let esRecuperacion = false;
  supa.auth.onAuthStateChange((event)=>{
    if(event==='PASSWORD_RECOVERY'){
      esRecuperacion = true;
      renderNuevaContrasena();
    }
  });
  await new Promise(r=>setTimeout(r,300));
  if(esRecuperacion) return;
  const { data } = await supa.auth.getSession();
  if(data && data.session){
    await loadData();
  }else{
    renderLogin();
  }
}

function pedirPermisoNotificaciones(){
  if('Notification' in window && Notification.permission==='default'){
    Notification.requestPermission();
  }
}

function notificarUrgente(titulo, cuerpo){
  if('Notification' in window && Notification.permission==='granted'){
    new Notification(titulo, {body: cuerpo});
  }
}

function iniciarRecordatorioPausa(){
  setInterval(()=>{
    if(document.getElementById('pausa-banner')) return;
    const banner = document.createElement('div');
    banner.id = 'pausa-banner';
    banner.style.cssText = 'position:fixed; bottom:20px; right:20px; max-width:300px; background:var(--surface); border:1px solid var(--gold-dim); border-radius:10px; padding:14px 16px; z-index:100; box-shadow:0 4px 20px rgba(0,0,0,0.4);';
    banner.innerHTML = `
      <div style="font-size:13px; margin-bottom:8px;">☕ Llevás un rato scrolleando Instagram. Cortá unos minutos — mucha actividad seguida puede disparar alguna verificación de seguridad.</div>
      <button class="ghost" style="font-size:12px; padding:5px 10px;" id="pausa-cerrar">Entendido</button>
    `;
    document.body.appendChild(banner);
    document.getElementById('pausa-cerrar').onclick = ()=>banner.remove();
    notificarUrgente('Hora de una pausa', 'Llevás un rato en el CRM — cortá unos minutos.');
  }, 27*60*1000);
}

function iniciarChequeoAlertasUrgentes(){
  setInterval(()=>{
    const alertas = getAlerts();
    const videos = alertas.filter(a=>a.tipo==='video');
    if(videos.length){
      notificarUrgente('Reels por vencer', `${videos.length} reel(s) están por cumplir 15 días sin descargar.`);
    }
  }, 60*60*1000);
}

iniciarApp();
pedirPermisoNotificaciones();
iniciarChequeoAlertasUrgentes();
iniciarRecordatorioPausa();
</script>
